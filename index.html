<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#0b0f1a; --card:#151b2b; --card2:#1d2438; --line:#283149; --txt:#e9edf6; --muted:#8a94ad; --accent:#4f8cff; --accent2:#2bd47a; --danger:#ff5c6c; --warn:#ffb84f; --radius:16px;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  body{margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); padding-bottom:110px;}
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  header{position:sticky; top:0; z-index:20; background:rgba(11,15,26,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:14px 16px 12px;}
  h1{font-size:20px; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  h1 .hbtn{width:40px; height:40px; flex:0 0 auto; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--txt); font-size:17px; font-weight:700; padding:0;}
  h1 .hbtn.on{background:var(--accent); border-color:var(--accent);}
  .seg{display:flex; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:3px; margin-bottom:12px;}
  .seg button{flex:1; height:40px; border:none; background:transparent; color:var(--muted); font-size:15px; font-weight:700; border-radius:9px;}
  .seg button.active{background:var(--accent); color:#fff;}
  .seg.small{margin:6px 0 0;}
  .seg.small button{height:36px; font-size:13px;}
  .tabs{display:flex; gap:8px; overflow-x:auto; padding:0 0 10px; -webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px;}
  .tab .pdot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .tab.archived{border-style:dashed; font-style:italic;}
  .tab.add{background:transparent; color:var(--accent); border-style:dashed;}
  .planbar{display:flex; align-items:center; gap:7px; padding:0 0 12px; flex-wrap:wrap;}
  .planbar .lbl{font-size:12px; color:var(--muted);}
  .planbar .cpick{width:40px; height:32px; padding:0; border:1px solid var(--line); border-radius:8px; background:var(--card2); -webkit-appearance:none; appearance:none;}
  .planbar .cpick::-webkit-color-swatch-wrapper{padding:3px;}
  .planbar .cpick::-webkit-color-swatch{border:none; border-radius:5px;}
  .planbar .pbtn{height:32px; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--txt); font-size:12px; font-weight:700;}
  .planbar .pbtn:first-of-type{margin-left:auto;}
  .daynav{display:flex; align-items:center; gap:8px;}
  .daynav button.arrow{background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:12px; width:46px; height:48px; font-size:22px; flex:0 0 auto;}
  .daynav .date{flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); border-radius:12px; height:48px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:700; color:var(--txt);}
  .daynav .date .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .today-tag{font-size:11px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:.4px;}
  .wrap{padding:14px 16px; max-width:720px; margin:0 auto;}
  .banner{display:flex; align-items:center; gap:10px; background:rgba(255,184,79,.1); border:1px solid rgba(255,184,79,.45); border-radius:12px; padding:10px 12px; margin-bottom:14px; font-size:13px; line-height:1.4;}
  .banner span{flex:1;}
  .banner button{flex:0 0 auto; height:36px; padding:0 14px; border-radius:10px; border:none; background:var(--warn); color:#2a1a00; font-weight:800; font-size:13px;}
  .savebar{position:fixed; top:0; left:0; right:0; z-index:60; display:flex; gap:10px; align-items:center; background:var(--danger); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; font-size:13px; font-weight:600; line-height:1.4;}
  .savebar span{flex:1;}
  .savebar button{height:36px; padding:0 14px; border-radius:10px; border:none; background:#fff; color:#7a0010; font-weight:800;}
  .ex-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; overflow:hidden;}
  .ex-head{display:flex; align-items:flex-start; gap:10px; padding:11px 12px 11px 14px; background:var(--card2);}
  .ex-head .meta{flex:1; min-width:0;}
  .ex-head .name{font-size:16px; font-weight:700; overflow-wrap:anywhere;}
  .ex-head .tag{display:inline-block; font-size:11px; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:2px;}
  .ex-head .desc{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4; white-space:pre-wrap;}
  .ex-head .last{font-size:12px; color:var(--muted); margin-top:4px;}
  .ex-head .btns{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
  .ex-head .btns button{width:36px; height:36px; padding:0; font-size:14px; color:var(--txt); background:var(--bg); border:1px solid var(--line); border-radius:8px;}
  .ex-head .btns button:disabled{opacity:.25;}
  .sets{padding:6px 10px 10px;}
  .set-row{display:grid; grid-template-columns:42px 1fr 1fr 46px; gap:8px; align-items:center; margin-top:8px; position:relative;}
  .set-row.head{margin-top:2px;}
  .set-row.head span{font-size:12px; color:var(--muted); text-align:center; font-weight:600;}
  .set-row .idx{font-size:14px; font-weight:800; color:var(--muted); background:var(--bg); border:1px solid transparent; border-radius:10px; height:46px; padding:0;}
  .set-row input{width:100%; height:46px; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--txt); font-size:17px; text-align:center; font-weight:600; font-family:inherit;}
  .set-row input::placeholder{color:#55607a; font-weight:500;}
  .set-row input:focus{border-color:var(--accent); outline:none;}
  .set-row .done{height:46px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--muted); font-size:18px; font-weight:800; padding:0;}
  .set-row.isdone .done{background:var(--accent2); border-color:var(--accent2); color:#04230f;}
  .set-row.isdone input{border-color:rgba(43,212,122,.45);}
  .set-row.warm .idx{color:var(--warn); border-color:rgba(255,184,79,.4);}
  .set-row.warm input{border-style:dashed; color:var(--muted);}
  .set-row .prb{position:absolute; top:-7px; right:50px; font-size:13px; line-height:1; pointer-events:none;}
  .card-actions{display:flex; gap:8px; margin-top:10px;}
  .card-actions button{flex:1; padding:11px; background:transparent; color:var(--accent); border:1px dashed var(--line); border-radius:12px; font-size:14px; font-weight:600;}
  .addex{width:100%; padding:14px; background:var(--card); color:var(--accent); border:1px dashed var(--accent); border-radius:var(--radius); font-size:15px; font-weight:700;}
  .pl-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:2px 10px; margin-bottom:6px;}
  .pl-row{display:grid; grid-template-columns:36px 1fr 40px; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
  .pl-row:last-child{border-bottom:none;}
  .pl-mv{display:flex; flex-direction:column; gap:4px;}
  .pl-mv button{height:30px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--txt); font-size:11px; padding:0;}
  .pl-mv button:disabled{opacity:.25;}
  .pl-mid{min-width:0;}
  .pl-name{width:100%; height:40px; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--txt); font-size:16px; font-weight:700; padding:0 10px; font-family:inherit;}
  .pl-name:focus{border-color:var(--accent); outline:none;}
  .pl-sub{display:flex; gap:6px; margin-top:6px; min-width:0;}
  .pl-sub select{flex:0 0 auto; height:32px; background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:8px; font-size:16px; padding:0 4px; font-family:inherit;}
  .pl-desc{flex:1; min-width:0; height:32px; background:none; border:1px dashed var(--line); border-radius:8px; color:var(--muted); font-size:12px; text-align:left; padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pl-rm{height:40px; border-radius:10px; border:1px solid rgba(255,92,108,.35); background:transparent; color:var(--danger); font-size:16px; padding:0; align-self:start;}
  .hint{font-size:12px; color:var(--muted); text-align:center; margin:2px 0 12px; line-height:1.6;}
  .hint button{background:none; border:none; color:var(--accent); font-weight:700; font-size:12px; padding:4px 6px; text-decoration:underline;}
  .notes{margin-top:14px;}
  .notes label{display:block; font-size:12px; color:var(--muted); font-weight:700; margin:0 0 6px 2px;}
  .notes textarea{width:100%; min-height:70px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:var(--txt); font-size:16px; padding:10px 12px; font-family:inherit; resize:vertical;}
  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; line-height:1.6;}
  .prog-plan{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; margin:20px 0 8px; display:flex; align-items:center; gap:8px; color:var(--txt);}
  .prog-plan .pdot{width:11px; height:11px; border-radius:50%;}
  .prog-plan .tag{font-size:11px; color:var(--muted); text-transform:none; letter-spacing:0; font-weight:600;}
  .chart-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px;}
  .chart-card .ctitle{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:4px;}
  .chart-card .ctitle b{font-size:15px; overflow-wrap:anywhere;}
  .chart-card .delta{font-size:12px; font-weight:800; white-space:nowrap;}
  .chart-card .csub{font-size:12px; color:var(--muted); margin-bottom:10px; line-height:1.4;}
  .chart-card svg{width:100%; height:auto; display:block; overflow:visible; touch-action:pan-y;}
  .chart-card .tbtn{background:none; border:none; color:var(--accent); font-size:12px; font-weight:700; padding:6px 0 0;}
  .mini{width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; font-variant-numeric:tabular-nums;}
  .mini th,.mini td{padding:5px 6px; border-bottom:1px solid var(--line); text-align:right;}
  .mini th:first-child,.mini td:first-child{text-align:left;}
  .mini th{color:var(--muted); font-weight:600; font-size:12px;}
  .ctrl{display:flex; gap:8px; margin-bottom:8px;}
  .ctrl button{flex:1; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--muted); font-size:13px; font-weight:700; padding:0 4px;}
  .ctrl button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .ctrl.range button{height:32px; font-size:12px;}
  .note{font-size:12px; color:var(--muted); margin:2px 2px 8px; line-height:1.5;}
  .tip{position:fixed; z-index:70; pointer-events:none; background:#0b0f1a; border:1px solid var(--line); color:var(--txt); font-size:12px; font-weight:600; padding:6px 9px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.45); white-space:nowrap; transform:translate(-50%,-100%);}
  .tip small{display:block; color:var(--muted); font-weight:500;}
  .toast{position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(200px); background:var(--accent2); color:#04230f; padding:12px 20px; border-radius:999px; font-weight:700; font-size:14px; transition:transform .25s; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:calc(100% - 32px); text-align:center;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  #rest{position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(140px); transition:transform .25s; z-index:45; display:flex; align-items:center; gap:8px; background:var(--card2); border:1px solid var(--line); border-radius:999px; padding:6px 6px 6px 18px; box-shadow:0 8px 24px rgba(0,0,0,.5); width:min(420px, calc(100% - 32px));}
  #rest.show{transform:translateX(-50%) translateY(0);}
  #rest.over{border-color:var(--accent2); background:#11301f;}
  #rest .rl{font-size:12px; color:var(--muted); font-weight:700;}
  #rest b{flex:1; font-size:22px; font-variant-numeric:tabular-nums;}
  #rest button{height:42px; min-width:50px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--txt); font-weight:800; font-size:14px;}
  dialog{border:none; border-radius:var(--radius); background:var(--card); color:var(--txt); width:92%; max-width:400px; padding:20px; max-height:88vh; overflow:auto;}
  dialog::backdrop{background:rgba(0,0,0,.6);}
  dialog h3{margin:0 0 14px; font-size:18px;}
  dialog input[type=text],dialog textarea{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:12px; color:var(--txt); font-size:16px; padding:12px 14px; margin:6px 0 14px; font-family:inherit;}
  dialog textarea{min-height:90px; resize:vertical;}
  .fl{display:block; font-size:12px; color:var(--muted); font-weight:700;}
  .fl .seg{margin-bottom:14px;}
  .dlg-btns{display:flex; gap:10px;}
  .dlg-btns button{flex:1; height:46px; border-radius:12px; border:none; font-size:15px; font-weight:700;}
  .btn-cancel{background:var(--card2); color:var(--muted);}
  .btn-ok{background:var(--accent); color:#fff;}
  .linkdanger{display:block; width:100%; margin-top:12px; background:none; border:none; color:var(--danger); font-weight:700; font-size:14px; padding:10px;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .btn-wide{height:48px; border-radius:12px; border:1px solid var(--line); background:var(--card2); color:var(--txt); font-size:15px; font-weight:700;}
  .btn-wide.danger{color:var(--danger); border-color:rgba(255,92,108,.4); background:transparent;}
  .btn-wide.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .sset h4{margin:18px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
  .sset h4:first-of-type{margin-top:0;}
  .sset p{font-size:13px; color:var(--muted); line-height:1.5; margin:4px 0 10px;}
  .sset .row{display:flex; align-items:center; gap:8px; font-size:14px; margin:8px 0; flex-wrap:wrap;}
  .sset .row input[type=text]{width:72px; margin:0; padding:8px 10px; text-align:center;}
  .sset .chk{display:flex; align-items:flex-start; gap:10px; font-size:14px; line-height:1.4; margin:8px 0;}
  .sset .chk input{width:20px; height:20px; margin:0; flex:0 0 auto; accent-color:var(--accent);}
  .arch{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .arch span{flex:1; min-width:0; overflow-wrap:anywhere;}
  .arch small{color:var(--muted);}
  .arch button{height:32px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--card2); color:var(--txt); font-size:12px; font-weight:700;}
  .arch button.del{color:var(--danger); background:transparent;}
  .cal-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-top button{background:var(--card2); border:1px solid var(--line); color:var(--txt); width:42px; height:42px; border-radius:10px; font-size:18px;}
  .cal-top .mtitle{font-size:16px; font-weight:700;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-dow{text-align:center; font-size:12px; color:var(--muted); font-weight:700; padding-bottom:4px;}
  .cal-day{height:46px; border:1px solid transparent; border-radius:10px; background:var(--bg); color:var(--txt); font-size:15px; font-weight:600; position:relative; padding:0;}
  .cal-day.has{background:var(--card2);}
  .cal-day.today{border-color:var(--accent);}
  .cal-day.sel{outline:2px solid var(--accent); outline-offset:-2px;}
  .cal-day .dots{position:absolute; bottom:5px; left:0; right:0; display:flex; justify-content:center; gap:3px;}
  .cal-day .dots i{width:6px; height:6px; border-radius:50%; display:block;}
  .cal-btns{display:flex; gap:10px; margin-top:14px;}
  .cal-btns button{flex:1; height:44px; border:none; border-radius:12px; font-weight:700; font-size:15px;}
  #printArea{display:none;}
  @media print{
    body{background:#fff; color:#000; padding:0;}
    header,.toast,dialog,#content,#rest,.savebar,.tip{display:none !important;}
    #printArea{display:block !important; padding:24px;}
    #printArea h2{font-size:22px; margin:0 0 4px;}
    #printArea .psub{color:#555; font-size:12px; margin-bottom:18px;}
    #printArea h3{font-size:16px; margin:20px 0 6px; border-bottom:2px solid #000; padding-bottom:3px;}
    #printArea table{width:100%; border-collapse:collapse; margin-bottom:10px; font-size:12px;}
    #printArea th,#printArea td{border:1px solid #999; padding:4px 7px; text-align:left;}
    #printArea th{background:#eee;}
    #printArea tr.w td{color:#777; font-style:italic;}
    #printArea .daterow{font-weight:700; margin:10px 0 4px; font-size:13px;}
    #printArea .pnote{font-size:12px; margin:0 0 10px; white-space:pre-wrap;}
    #printArea .sess,#printArea .prog{page-break-inside:avoid; margin-bottom:6px;}
  }
</style>
</head>
<body>
<div class="savebar" id="saveErr" role="alert" hidden><span id="saveErrTxt">Couldn't save. This browser's storage is full or blocked. Export a backup now so nothing is lost.</span><button id="saveErrExport">Export</button></div>
<header>
  <h1><span style="flex:1">🏋️ Gym Tracker</span>
    <button class="hbtn" id="hRest" aria-label="Rest timer" title="Rest timer">⏱</button>
    <button class="hbtn" id="hPdf" aria-label="Export this plan as PDF" title="Export PDF">⬇︎</button>
    <button class="hbtn" id="hSet" aria-label="Settings and backup" title="Settings">⚙︎</button></h1>
  <div class="seg" id="seg" role="tablist">
    <button data-view="log" class="active">Log</button>
    <button data-view="plans">Plans</button>
    <button data-view="progress">Progress</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="planbar" id="planbar"></div>
  <div class="daynav" id="daynav">
    <button class="arrow" id="prevDay" aria-label="Previous day">‹</button>
    <button class="date" id="dateBtn" aria-label="Choose date"><span aria-hidden="true">📅</span><span id="dateTxt">—</span></button>
    <button class="arrow" id="nextDay" aria-label="Next day">›</button>
  </div>
</header>

<main class="wrap"><div id="content"></div></main>
<div id="printArea"></div>
<div id="rest" role="timer"><span class="rl">Rest</span><b id="restTime">2:00</b><button id="restMinus" aria-label="15 seconds less">−15</button><button id="restPlus" aria-label="15 seconds more">+15</button><button id="restStop" aria-label="Stop rest timer">✕</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<dialog id="dlg">
  <h3 id="dlgTitle">Add</h3>
  <input id="dlgInput" type="text" autocomplete="off" maxlength="60" placeholder="Name">
  <div class="dlg-btns"><button class="btn-cancel" id="dlgCancel">Cancel</button><button class="btn-ok" id="dlgOk">Add</button></div>
</dialog>
<dialog id="exDlg">
  <h3 id="exTitle">Exercise</h3>
  <label class="fl">Name<input id="exName" type="text" autocomplete="off" maxlength="80" placeholder="e.g. Bench press"></label>
  <div class="fl">Type<div class="seg small" id="exKind"><button data-k="weight">Weighted</button><button data-k="body">Bodyweight</button><button data-k="time">Timed</button></div></div>
  <label class="fl">Description<textarea id="exDesc" maxlength="1000" placeholder="e.g. Flat barbell, pause on chest, elbows ~45°"></textarea></label>
  <div class="dlg-btns"><button class="btn-cancel" id="exCancel">Cancel</button><button class="btn-ok" id="exOk">Save</button></div>
  <button class="linkdanger" id="exRemove">Remove from plan</button>
</dialog>
<dialog id="setDlg">
  <h3 id="setTitle">Set</h3>
  <div class="stack"><button class="btn-wide" id="setWarm">Mark as warm-up</button><button class="btn-wide danger" id="setDel">Delete set</button><button class="btn-wide btn-cancel" id="setCancel">Cancel</button></div>
</dialog>
<dialog id="calDlg">
  <div class="cal-top"><button id="calPrev" aria-label="Previous month">‹</button><span class="mtitle" id="calTitle"></span><button id="calNext" aria-label="Next month">›</button></div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="cal-btns"><button id="calToday" class="btn-ok">Today</button><button id="calClose" class="btn-cancel">Close</button></div>
</dialog>
<dialog id="setsDlg"><div class="sset" id="setBody"></div></dialog>

<script>
'use strict';
/* ---------- constants ---------- */
const STORE='gymtracker_v2', OLD_STORE='gymtracker_v1', PREV_STORE='gymtracker_v2_prev', BAD_STORE='gymtracker_v2_unreadable';
const SCHEMA=2;
const PALETTE=['#4f8cff','#2bd47a','#ff5c6c','#ffb84f','#b07cff','#4fd6e0','#ff7cc4','#9ad44f'];
const KG_PER_LB=0.45359237;
const KINDS={ weight:{label:'Weighted',w:'Weight',r:'Reps'}, body:{label:'Bodyweight',w:'Added',r:'Reps'}, time:{label:'Timed',w:'Added',r:'Seconds'} };
const okKind=k=>k==='weight'||k==='body'||k==='time';
const BACKUP_EVERY=5;
const RANGES={'3m':91,'6m':182,'1y':365,all:Infinity};

/* ---------- small utils ---------- */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const pad=n=>String(n).padStart(2,'0');
function uid(){ return (Math.random().toString(36).slice(2,10)+Date.now().toString(36)).replace(/[^a-z0-9]/g,'').slice(0,16); }
const isId=s=>typeof s==='string'&&/^[a-z0-9]{4,40}$/.test(s);
const validColor=c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)? c.toLowerCase() : null;
const clampStr=(s,n)=>typeof s==='string'? s.slice(0,n) : '';
function num(v){ if(v===null||v===undefined||v==='') return null; const x=typeof v==='number'? v : parseFloat(String(v).trim().replace(',','.')); return isFinite(x)&&x>=0&&x<100000? x : null; }
const isDateStr=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
function fmtNum(v,dp=2){ if(v==null||!isFinite(v)) return ''; const f=10**dp; return String(Math.round(v*f)/f); }
function fmtBig(v){ return (Math.round(v*10)/10).toLocaleString('en-GB',{maximumFractionDigits:1}); }
function sameArr(a,b){ return a.length===b.length&&a.every((x,i)=>x===b[i]); }

/* ---------- dates (always local time, never UTC) ---------- */
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d,12); }
function shiftDay(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
const dayNum=s=>{ const [y,m,d]=s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/86400000); };
const fullDate=s=>parseYmd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
const shortDate=s=>parseYmd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const ddmm=s=>parseYmd(s).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'});
const monYY=s=>parseYmd(s).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
const firstOfMonth=s=>s.slice(0,8)+'01';
function mondayOf(s){ const d=parseYmd(s); d.setDate(d.getDate()-(d.getDay()+6)%7); return ymd(d); }

/* ---------- units ---------- */
const U=()=>db.settings.unit;
const toDisp=kg=>kg==null? null : (U()==='lb'? kg/KG_PER_LB : kg);
const fromDisp=v=>v==null? null : (U()==='lb'? v*KG_PER_LB : v);
const fmtW=kg=>fmtNum(toDisp(kg));

/* ---------- data model ----------
   plans: [{id, name, color, archived, exercises:[{id, name, desc, kind, archived}]}]
   log:   { 'YYYY-MM-DD': { planId: { ex:{ exId:[{w(kg)|null, r|null, warm, done}] }, order?:[exId], note? } } }
   Weights are always stored in kg; lb is a display setting. */
function defaultSettings(){ return {unit:'kg', backoff:true, backoffPct:80, roundKg:2.5, roundLb:5, restSec:120, restAuto:true, backupAt:null, backupCount:0}; }
function defaultDb(){ return {version:SCHEMA, settings:defaultSettings(), plans:['Push','Pull','Legs','Upper','Lower'].map((n,i)=>({id:uid(),name:n,color:PALETTE[i],archived:false,exercises:[]})), log:{}}; }
const blankSet=()=>({w:null,r:null,warm:false,done:false});
const cleanSet=s=>{ s=s||{}; return {w:num(s.w), r:num(s.r), warm:!!s.warm, done:!!s.done}; };
const isBlank=s=>s.w==null&&s.r==null;
const isReal=s=>s.r>0;
const isWork=s=>isReal(s)&&!s.warm;
const hasData=e=>!!(e&&e.ex&&Object.keys(e.ex).some(k=>e.ex[k].some(isReal)));

function cleanSettings(s){
  const d=defaultSettings(); s=s&&typeof s==='object'? s : {};
  const n=(v,lo,hi,def)=>{ v=num(v); return v!=null&&v>=lo&&v<=hi? v : def; };
  if(s.unit==='lb') d.unit='lb';
  if(typeof s.backoff==='boolean') d.backoff=s.backoff;
  d.backoffPct=n(s.backoffPct,30,100,80); d.roundKg=n(s.roundKg,0.25,20,2.5); d.roundLb=n(s.roundLb,0.5,50,5);
  d.restSec=Math.round(n(s.restSec,10,900,120));
  if(typeof s.restAuto==='boolean') d.restAuto=s.restAuto;
  if(isDateStr(s.backupAt)) d.backupAt=s.backupAt;
  d.backupCount=Math.round(n(s.backupCount,0,1e6,0));
  return d;
}

/* Rebuilds the database from known fields only, so a damaged or hand-edited file can't inject markup or break the app. */
function sanitize(d){
  if(!d||typeof d!=='object'||Array.isArray(d)) throw new Error('This is not a Gym Tracker file.');
  if(!d.version){ if(d.plans&&typeof d.plans==='object'&&!Array.isArray(d.plans)) return sanitize(migrateV1(d)); throw new Error('This is not a Gym Tracker file.'); }
  if(d.version>SCHEMA) throw new Error('This backup was made by a newer version of Gym Tracker.');
  if(!Array.isArray(d.plans)) throw new Error('This is not a Gym Tracker file.');
  const out={version:SCHEMA, settings:cleanSettings(d.settings), plans:[], log:{}};
  const exOf=new Map(), seen=new Set();
  d.plans.forEach((p,i)=>{
    if(!p||!isId(p.id)||seen.has(p.id)) return; seen.add(p.id);
    const plan={id:p.id, name:clampStr(p.name,60).trim()||'Plan', color:validColor(p.color)||PALETTE[i%PALETTE.length], archived:!!p.archived, exercises:[]};
    const ids=new Set(); exOf.set(p.id,ids);
    (Array.isArray(p.exercises)? p.exercises : []).forEach(e=>{
      if(!e||!isId(e.id)||seen.has(e.id)) return; seen.add(e.id); ids.add(e.id);
      plan.exercises.push({id:e.id, name:clampStr(e.name,80).trim()||'Exercise', desc:clampStr(e.desc,1000), kind:okKind(e.kind)? e.kind : 'weight', archived:!!e.archived});
    });
    out.plans.push(plan);
  });
  const log=d.log&&typeof d.log==='object'? d.log : {};
  Object.keys(log).forEach(date=>{
    const day=log[date]; if(!isDateStr(date)||!day||typeof day!=='object') return;
    Object.keys(day).forEach(pid=>{
      const ids=exOf.get(pid); const src=day[pid]; if(!ids||!src||typeof src!=='object') return;
      const e={ex:{}}; const exs=src.ex&&typeof src.ex==='object'? src.ex : {};
      Object.keys(exs).forEach(eid=>{
        if(!ids.has(eid)||!Array.isArray(exs[eid])) return;
        const sets=exs[eid].slice(0,100).map(cleanSet).filter(s=>!isBlank(s));
        if(sets.length) e.ex[eid]=sets;
      });
      if(Array.isArray(src.order)){ const o=[...new Set(src.order.filter(id=>ids.has(id)))]; if(o.length) e.order=o; }
      const note=clampStr(src.note,4000); if(note.trim()) e.note=note;
      if(Object.keys(e.ex).length||e.order||e.note) (out.log[date]=out.log[date]||{})[pid]=e;
    });
  });
  return out;
}

/* v1 kept everything keyed by name; give each plan and exercise a stable id. */
function migrateV1(d){
  const out={version:SCHEMA, settings:defaultSettings(), plans:[], log:{}};
  const pids={}, eids={};
  Object.keys(d.plans||{}).forEach((pname,i)=>{
    const plan={id:uid(), name:String(pname).slice(0,60), color:validColor(d.colors&&d.colors[pname])||PALETTE[i%PALETTE.length], archived:false, exercises:[]};
    const m=new Map(); eids[pname]=m;
    (Array.isArray(d.plans[pname])? d.plans[pname] : []).forEach(e=>{
      const name=typeof e==='string'? e : (e&&e.name); if(!name||m.has(name)) return;
      const ex={id:uid(), name:String(name).slice(0,80), desc:e&&typeof e==='object'&&e.desc? String(e.desc) : '', kind:'weight', archived:false};
      m.set(name,ex.id); plan.exercises.push(ex);
    });
    pids[pname]=plan.id; out.plans.push(plan);
  });
  Object.keys(d.log||{}).forEach(date=>{
    if(!isDateStr(date)) return; const day=d.log[date]||{};
    Object.keys(day).forEach(pname=>{
      const pid=pids[pname]; const m=eids[pname]; if(!pid) return;
      const e={ex:{}};
      Object.keys(day[pname]||{}).forEach(exName=>{
        const eid=m.get(exName); if(!eid) return;
        const sets=(Array.isArray(day[pname][exName])? day[pname][exName] : []).map(cleanSet).filter(s=>!isBlank(s));
        if(sets.length) e.ex[eid]=sets;
      });
      const ord=d.order&&d.order[pname]&&d.order[pname][date];
      if(Array.isArray(ord)){ const o=ord.map(n=>m.get(n)).filter(Boolean); if(o.length) e.order=o; }
      if(Object.keys(e.ex).length||e.order) (out.log[date]=out.log[date]||{})[pid]=e;
    });
  });
  const dates=Object.keys(out.log).sort();
  out.plans.forEach(p=>{
    // v1 used the order of a plan's first session as the template for new dates; make that the default order
    const first=dates.find(dt=>hasData(out.log[dt][p.id]));
    const ord=first&&out.log[first][p.id].order;
    if(ord){ const pos=id=>{ const i=ord.indexOf(id); return i<0? 1e6 : i; }; p.exercises.sort((a,b)=>pos(a.id)-pos(b.id)); }
    // drop per-date orders that now match the default, so they don't show as "changed for this date"
    const def=p.exercises.map(x=>x.id);
    dates.forEach(dt=>{ const e=out.log[dt][p.id]; if(e&&e.order&&sameArr(e.order.concat(def.filter(id=>!e.order.includes(id))),def)) delete e.order; });
    // an exercise that has reps logged but never a weight was a bodyweight exercise
    p.exercises.forEach(ex=>{
      let reps=false, weight=false;
      dates.forEach(dt=>{ const e=out.log[dt][p.id]; (e&&e.ex[ex.id]||[]).forEach(s=>{ if(s.r>0) reps=true; if(s.w>0) weight=true; }); });
      if(reps&&!weight) ex.kind='body';
    });
  });
  return out;
}

/* ---------- storage ---------- */
let bootNote=null, saveT=null, _dates=null, _datesFor=null;
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(STORE); }catch(e){ bootNote='blocked'; return defaultDb(); }
  if(raw){
    try{ return sanitize(JSON.parse(raw)); }
    catch(e){ try{ localStorage.setItem(BAD_STORE,raw); }catch(_){} bootNote='unreadable'; return defaultDb(); }
  }
  let old=null; try{ old=localStorage.getItem(OLD_STORE); }catch(e){}
  if(old){ try{ const d=sanitize(migrateV1(JSON.parse(old))); bootNote='migrated'; return d; }catch(e){} }
  return defaultDb();
}
function save(){
  clearTimeout(saveT); saveT=null;
  try{ localStorage.setItem(STORE, JSON.stringify(db)); $('saveErr').hidden=true; return true; }
  catch(e){ $('saveErr').hidden=false; return false; }
}
/* Typing calls changed(), which saves shortly after; structural edits call commit(), which saves straight away. */
function changed(){ _dates=null; clearTimeout(saveT); saveT=setTimeout(save,400); }
function commit(){ _dates=null; return save(); }
function keepPrev(){ try{ localStorage.setItem(PREV_STORE, JSON.stringify({savedAt:new Date().toISOString(), db})); return true; }catch(e){ return false; } }
let persistState='unknown';
async function askPersist(){
  try{ if(navigator.storage&&navigator.storage.persist){ persistState=(await navigator.storage.persisted()||await navigator.storage.persist())? 'yes' : 'no'; } }catch(e){}
}

/* ---------- lookups ---------- */
/* sorted dates, cached until the log changes or the whole database is replaced */
const allDates=()=>_dates&&_datesFor===db? _dates : (_datesFor=db, _dates=Object.keys(db.log).sort());
const planById=id=>db.plans.find(p=>p.id===id)||null;
function entry(date,pid,create){
  let day=db.log[date]; if(!day){ if(!create) return null; day=db.log[date]={}; _dates=null; }
  let e=day[pid]; if(!e){ if(!create) return null; e=day[pid]={ex:{}}; }
  return e;
}
function dayPlans(date){ const day=db.log[date]; return day? db.plans.filter(p=>hasData(day[p.id])).map(p=>p.id) : []; }
function sessionCount(d=db){ let n=0; Object.keys(d.log).forEach(dt=>Object.keys(d.log[dt]).forEach(pid=>{ if(hasData(d.log[dt][pid])) n++; })); return n; }
function exHasHistory(pid,eid){ return allDates().some(d=>{ const e=db.log[d][pid]; return e&&e.ex[eid]&&e.ex[eid].some(s=>!isBlank(s)); }); }
const planHasHistory=pid=>allDates().some(d=>hasData(db.log[d][pid]));
const tabPlans=()=>{ const dp=dayPlans(curDate); return db.plans.filter(p=>!p.archived||dp.includes(p.id)); };
function fixCurPlan(){ const tp=tabPlans(); if(!tp.some(p=>p.id===curPlan)) curPlan=tp.length? tp[0].id : null; }

/* ---------- stats ---------- */
const epley=(w,r)=>w>0&&r>0? (r===1? w : w*(1+r/30)) : 0;
const setScore=(ex,s)=>ex.kind==='weight'? epley(s.w||0,s.r) : s.r;
function sessionStats(ex,sets){
  const w=sets.filter(isWork); if(!w.length) return null;
  if(ex.kind==='weight'){ let top=0,vol=0,e1=0; w.forEach(s=>{ const kg=s.w||0; top=Math.max(top,kg); vol+=kg*s.r; e1=Math.max(e1,epley(kg,s.r)); }); return {e1rm:e1, top, vol}; }
  let best=0,tot=0; w.forEach(s=>{ best=Math.max(best,s.r); tot+=s.r; }); return {e1rm:best, top:best, vol:tot};
}
function metricInfo(ex,m){
  if(ex.kind==='weight') return {weight:true, unit:U(), label:{e1rm:'Estimated 1-rep max',top:'Top set',vol:'Volume (weight × reps)'}[m]};
  const t=ex.kind==='time';
  return {weight:false, unit:t?'s':'reps', label:m==='vol'? (t?'Total time':'Total reps') : (t?'Longest set':'Best set')};
}
function exHistory(pid,ex){
  const out=[];
  allDates().forEach(d=>{ const e=db.log[d][pid]; const st=e&&e.ex[ex.id]&&sessionStats(ex,e.ex[ex.id]); if(st) out.push(Object.assign({date:d},st)); });
  return out;
}
function lastSession(pid,eid,before){
  const ds=allDates();
  for(let i=ds.length-1;i>=0;i--){ const d=ds[i]; if(d>=before) continue; const e=db.log[d][pid]; const s=e&&e.ex[eid]; if(s&&s.some(isReal)) return {date:d,sets:s}; }
  return null;
}
function priorBest(pid,ex,before){
  let b=0;
  for(const d of allDates()){ if(d>=before) break; const e=db.log[d][pid]; const s=e&&e.ex[ex.id]; if(s) s.forEach(x=>{ if(isWork(x)) b=Math.max(b,setScore(ex,x)); }); }
  return b;
}
function setsText(ex,sets){
  const parts=[];
  sets.filter(isWork).forEach(s=>{
    const w=s.w>0? (ex.kind==='weight'? '' : '+')+fmtW(s.w)+'×' : (ex.kind==='weight'? '–×' : '');
    const t=w+fmtNum(s.r)+(ex.kind==='time'?'s':'');
    const last=parts[parts.length-1];
    if(last&&last.t===t) last.n++; else parts.push({t,n:1});
  });
  return parts.map(p=>p.t+(p.n>1?' ×'+p.n:'')).join(' · ');
}

/* ---------- exercise order ----------
   Each plan has a default order (its exercise list). Moving exercises on a date stores an order for that date only. */
function dayList(plan,date){
  const e=entry(date,plan.id); const map=new Map(plan.exercises.map(x=>[x.id,x]));
  const visible=x=>!x.archived||!!(e&&e.ex[x.id]&&e.ex[x.id].some(s=>!isBlank(s)));
  let ids=e&&e.order? e.order.slice() : plan.exercises.filter(x=>!x.archived).map(x=>x.id);
  ids=ids.filter(id=>map.has(id)&&visible(map.get(id)));
  plan.exercises.forEach(x=>{ if(visible(x)&&!ids.includes(x.id)) ids.push(x.id); });
  return ids.map(id=>map.get(id));
}
function moveExercise(plan,i,dir){
  const list=dayList(plan,curDate).map(x=>x.id); const j=i+dir; if(j<0||j>=list.length) return;
  [list[i],list[j]]=[list[j],list[i]];
  const e=entry(curDate,plan.id,true); delete e.order;
  if(!sameArr(list, dayList(plan,curDate).map(x=>x.id))) e.order=list;
  commit(); renderLog();
}
function makeDefaultOrder(plan){
  const e=entry(curDate,plan.id); if(!e||!e.order) return;
  const pos=id=>{ const i=e.order.indexOf(id); return i<0? 1e6 : i; };
  plan.exercises.sort((a,b)=>pos(a.id)-pos(b.id)); delete e.order;
  commit(); renderLog(); toast('Default order updated');
}

/* ---------- state ---------- */
let db=load();
let curPlan=null, curDate=todayStr(), lastToday=curDate, view='log', metric='e1rm', range='all', calCursor=null;
fixCurPlan();

/* ---------- header: tabs + plan bar + date ---------- */
function renderTabs(){
  const tabs=$('tabs'); tabs.innerHTML='';
  const list=view==='log'? tabPlans() : view==='plans'? db.plans.filter(p=>!p.archived) : [];
  list.forEach(p=>{
    const b=document.createElement('button'); b.className='tab'+(p.id===curPlan?' active':'')+(p.archived?' archived':'');
    b.innerHTML='<span class="pdot" style="background:'+p.color+'"></span>'+esc(p.name)+(p.archived?' (archived)':'');
    b.onclick=()=>{ curPlan=p.id; render(); }; tabs.appendChild(b);
  });
  if(view==='progress'){ tabs.style.display='none'; return; }
  tabs.style.display='flex';
  const add=document.createElement('button'); add.className='tab add'; add.textContent='+ Plan';
  add.onclick=()=>askDialog('New plan','Plan name','','Add',n=>{
    if(db.plans.some(p=>p.name.toLowerCase()===n.toLowerCase())){ toast('A plan with that name exists'); return false; }
    const p={id:uid(), name:n, color:PALETTE[db.plans.length%PALETTE.length], archived:false, exercises:[]};
    db.plans.push(p); curPlan=p.id; commit(); render();
  });
  tabs.appendChild(add);
}
function renderPlanBar(){
  const bar=$('planbar'); bar.innerHTML=''; const p=planById(curPlan);
  if(view!=='plans'||!p){ bar.style.display='none'; return; }
  bar.style.display='flex';
  bar.innerHTML='<label class="lbl" for="cpick">Plan colour</label>';
  const pick=document.createElement('input'); pick.type='color'; pick.id='cpick'; pick.className='cpick'; pick.value=p.color;
  pick.oninput=()=>{ const c=validColor(pick.value); if(!c) return; p.color=c; changed(); renderTabs(); renderDate(); };
  pick.onchange=()=>{ commit(); render(); };
  bar.appendChild(pick);
  const ren=document.createElement('button'); ren.className='pbtn'; ren.textContent='Rename';
  ren.onclick=()=>askDialog('Rename plan','Plan name',p.name,'Save',n=>{
    if(n===p.name) return;
    if(db.plans.some(q=>q!==p&&q.name.toLowerCase()===n.toLowerCase())){ toast('A plan with that name exists'); return false; }
    p.name=n; commit(); render(); toast('Plan renamed');
  });
  const arc=document.createElement('button'); arc.className='pbtn';
  arc.textContent=p.archived? 'Restore' : 'Archive';
  arc.onclick=()=>p.archived? restorePlan(p) : archivePlan(p);
  bar.appendChild(ren); bar.appendChild(arc);
}
function archivePlan(p){
  if(!planHasHistory(p.id)){
    if(!confirm('Delete the empty plan "'+p.name+'"?')) return;
    db.plans=db.plans.filter(q=>q!==p); Object.keys(db.log).forEach(d=>{ delete db.log[d][p.id]; if(!Object.keys(db.log[d]).length) delete db.log[d]; });
    curPlan=null; fixCurPlan(); commit(); render(); toast('Plan deleted'); return;
  }
  if(!confirm('Archive "'+p.name+'"?\n\nIt disappears from the tabs, but its history stays in Progress and the calendar. You can restore it in Settings.')) return;
  p.archived=true; curPlan=null; fixCurPlan(); commit(); render(); toast('Plan archived');
}
function restorePlan(p){ p.archived=false; curPlan=p.id; commit(); render(); toast('Plan restored'); }
function renderDate(){
  const dp=dayPlans(curDate); const id=dp.includes(curPlan)? curPlan : dp[0]; const p=id&&planById(id);
  $('dateTxt').innerHTML=esc(fullDate(curDate))+(curDate===todayStr()?' <span class="today-tag">Today</span>':'')+(p?' <span class="dot" style="background:'+p.color+'"></span>':'');
}

/* ---------- LOG ---------- */
function backupDue(){
  const n=sessionCount(), st=db.settings; if(!n) return 0;
  if(!st.backupAt) return n>=3? n : 0;
  const since=n-st.backupCount; return since>=BACKUP_EVERY? since : 0;
}
function renderLog(){
  const c=$('content'); c.innerHTML='';
  const due=backupDue();
  if(due){
    const b=document.createElement('div'); b.className='banner';
    b.innerHTML='<span>💾 '+(db.settings.backupAt? due+' sessions since your last backup ('+esc(ddmm(db.settings.backupAt))+').' : 'You haven’t backed up yet.')+' Your log only lives in this browser.</span><button>Export</button>';
    b.querySelector('button').onclick=exportBackup; c.appendChild(b);
  }
  const plan=planById(curPlan);
  if(!plan){ c.insertAdjacentHTML('beforeend','<div class="empty">Tap “+ Plan” to create your first workout plan.</div>'); return; }
  const list=dayList(plan,curDate);
  if(!list.length) c.insertAdjacentHTML('beforeend','<div class="empty">No exercises in <b>'+esc(plan.name)+'</b> yet.<br>List them all at once in the <b>Plans</b> tab, or tap “+ Add exercise” below.</div>');
  list.forEach((ex,i)=>c.appendChild(buildCard(plan,ex,i,list.length)));
  const e=entry(curDate,plan.id);
  if(e&&e.order&&list.length>1){
    const h=document.createElement('div'); h.className='hint';
    h.innerHTML='Order changed for this date only.<br><button data-a="def">Make this the default order</button><button data-a="reset">Reset</button>';
    h.querySelector('[data-a=def]').onclick=()=>makeDefaultOrder(plan);
    h.querySelector('[data-a=reset]').onclick=()=>{ delete e.order; commit(); renderLog(); };
    c.appendChild(h);
  }
  if(!plan.archived){
    const addEx=document.createElement('button'); addEx.className='addex'; addEx.textContent='+ Add exercise';
    addEx.onclick=()=>openExDialog(plan,null); c.appendChild(addEx);
    const lk=document.createElement('div'); lk.className='hint'; lk.style.marginTop='8px';
    lk.innerHTML='<button>Edit the '+esc(plan.name)+' exercise list</button>';
    lk.querySelector('button').onclick=()=>{ view='plans'; render(); window.scrollTo(0,0); };
    c.appendChild(lk);
  }
  const notes=document.createElement('div'); notes.className='notes';
  notes.innerHTML='<label for="noteIn">Session notes</label><textarea id="noteIn" maxlength="4000" placeholder="How it felt, sleep, niggles…"></textarea>';
  const ta=notes.querySelector('textarea'); ta.value=(e&&e.note)||'';
  ta.oninput=()=>{ entry(curDate,plan.id,true).note=ta.value; changed(); };
  c.appendChild(notes);
}

function buildCard(plan,ex,i,n){
  const e=entry(curDate,plan.id);
  let sets=e&&e.ex[ex.id]; let stored=!!sets;
  if(!sets) sets=[blankSet()];
  const store=()=>{ if(!stored){ entry(curDate,plan.id,true).ex[ex.id]=sets; stored=true; } };
  const k=KINDS[ex.kind]; const last=lastSession(plan.id,ex.id,curDate);
  const card=document.createElement('div'); card.className='ex-card';
  const refresh=(focus)=>{ const nc=buildCard(plan,ex,i,n); card.replaceWith(nc); if(focus) focus(nc); };
  card.innerHTML='<div class="ex-head"><div class="meta"><div class="name">'+esc(ex.name)+
      (ex.kind!=='weight'?'<span class="tag">'+k.label+'</span>':'')+(ex.archived?'<span class="tag">archived</span>':'')+'</div>'+
      (ex.desc?'<div class="desc">'+esc(ex.desc)+'</div>':'')+
      (last?'<div class="last">Last '+esc(ddmm(last.date))+': '+esc(setsText(ex,last.sets)||'warm-ups only')+'</div>':'')+'</div>'+
    '<div class="btns"><button class="up" aria-label="Move '+esc(ex.name)+' up"'+(i===0?' disabled':'')+'>▲</button>'+
      '<button class="down" aria-label="Move '+esc(ex.name)+' down"'+(i===n-1?' disabled':'')+'>▼</button>'+
      '<button class="edit" aria-label="Edit '+esc(ex.name)+'">✎</button></div></div>'+
    '<div class="sets"><div class="set-row head"><span>Set</span><span>'+k.w+' ('+U()+')</span><span>'+k.r+'</span><span>Done</span></div></div>';
  const box=card.querySelector('.sets');
  let workNo=0;
  sets.forEach((s,si)=>{
    const ph=last&&last.sets[si];
    const row=document.createElement('div'); row.className='set-row'+(s.warm?' warm':'')+(s.done?' isdone':'');
    const label=s.warm? 'W' : String(++workNo);
    const wPh=ph&&ph.w!=null? fmtW(ph.w) : (ex.kind==='weight'? '–' : 'BW');
    const rPh=ph&&ph.r!=null? fmtNum(ph.r) : '–';
    row.innerHTML='<button class="idx" aria-label="Set '+(si+1)+(s.warm?' (warm-up)':'')+' options">'+label+'</button>'+
      '<input type="text" inputmode="decimal" autocomplete="off" data-f="w" aria-label="Set '+(si+1)+' '+k.w.toLowerCase()+' in '+U()+'" placeholder="'+esc(wPh)+'" value="'+esc(fmtW(s.w))+'">'+
      '<input type="text" inputmode="numeric" autocomplete="off" data-f="r" aria-label="Set '+(si+1)+' '+k.r.toLowerCase()+'" placeholder="'+esc(rPh)+'" value="'+esc(fmtNum(s.r))+'">'+
      '<button class="done" aria-label="Mark set '+(si+1)+' done" aria-pressed="'+s.done+'">✓</button><span class="prb" hidden title="Personal best">🏆</span>';
    row.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{
      const v=num(inp.value); store();
      if(inp.dataset.f==='w') s.w=fromDisp(v); else s.r=v;
      changed(); renderDate(); markPR(card,plan,ex,sets);
    }));
    row.querySelector('.idx').onclick=()=>openSetMenu(s,si,sets,store,()=>refresh());
    row.querySelector('.done').onclick=()=>{
      store(); s.done=!s.done;
      if(s.done&&ph){ // one tap repeats last session's set
        if(s.w==null&&ph.w!=null){ s.w=ph.w; row.querySelector('[data-f=w]').value=fmtW(s.w); }
        if(s.r==null&&ph.r!=null){ s.r=ph.r; row.querySelector('[data-f=r]').value=fmtNum(s.r); }
      }
      row.classList.toggle('isdone',s.done); row.querySelector('.done').setAttribute('aria-pressed',s.done);
      changed(); renderDate(); markPR(card,plan,ex,sets);
      if(s.done&&db.settings.restAuto) startRest();
    };
    box.appendChild(row);
  });
  const acts=document.createElement('div'); acts.className='card-actions';
  const add=document.createElement('button'); add.textContent='+ Add set';
  add.onclick=()=>{
    const {set,msg}=nextSet(ex,sets); store(); sets.push(set); changed();
    refresh(nc=>{ const rows=nc.querySelectorAll('.set-row:not(.head)'); const r=rows[rows.length-1]; const f=r&&r.querySelector(set.w==null?'[data-f=w]':'[data-f=r]'); if(f) f.focus(); });
    toast(msg);
  };
  acts.appendChild(add);
  if(last&&sets.every(isBlank)){
    const rep=document.createElement('button'); rep.textContent='↻ Repeat last';
    rep.onclick=()=>{ store(); sets.length=0; last.sets.forEach(s=>sets.push({w:s.w,r:s.r,warm:s.warm,done:false})); changed(); renderDate(); refresh(); toast('Copied '+ddmm(last.date)); };
    acts.appendChild(rep);
  }
  box.appendChild(acts);
  card.querySelector('.up').onclick=()=>moveExercise(plan,i,-1);
  card.querySelector('.down').onclick=()=>moveExercise(plan,i,1);
  card.querySelector('.edit').onclick=()=>openExDialog(plan,ex);
  markPR(card,plan,ex,sets);
  return card;
}
/* Trophy on today's best set when it beats every earlier session. */
function markPR(card,plan,ex,sets){
  const rows=card.querySelectorAll('.set-row:not(.head)');
  const pb=priorBest(plan.id,ex,curDate); let best=-1, score=pb;
  if(pb>0) sets.forEach((s,i)=>{ if(isWork(s)){ const v=setScore(ex,s); if(v>score+1e-9){ score=v; best=i; } } });
  rows.forEach((r,i)=>{ const b=r.querySelector('.prb'); if(b) b.hidden=i!==best; });
}
/* Top set then back-offs: the 2nd working set suggests the back-off % of the top set; later sets copy the one before. */
function nextSet(ex,sets){
  const st=db.settings; const work=sets.filter(s=>!s.warm); const prev=sets[sets.length-1];
  if(ex.kind==='weight'&&st.backoff&&work.length===1&&work[0].w>0){
    const inc=U()==='lb'? st.roundLb : st.roundKg;
    const disp=Math.round(toDisp(work[0].w)*st.backoffPct/100/inc)*inc;
    return {set:{w:fromDisp(disp),r:null,warm:false,done:false}, msg:'Back-off set · '+fmtNum(disp)+' '+U()+' ('+fmtNum(st.backoffPct,1)+'% of '+fmtW(work[0].w)+')'};
  }
  if(prev&&!isBlank(prev)) return {set:{w:prev.w,r:prev.r,warm:prev.warm,done:false}, msg:'Set added · same as previous'};
  return {set:blankSet(), msg:'Set added'};
}

/* Exercises with history are archived (kept for Progress and past dates); empty ones are deleted. */
function removeExercise(plan,ex){
  if(!exHasHistory(plan.id,ex.id)){
    if(!confirm('Remove "'+ex.name+'" from '+plan.name+'?')) return false;
    plan.exercises=plan.exercises.filter(x=>x!==ex);
    Object.keys(db.log).forEach(d=>{ const e=db.log[d][plan.id]; if(e){ delete e.ex[ex.id]; if(e.order) e.order=e.order.filter(id=>id!==ex.id); } });
  } else {
    if(!confirm('Remove "'+ex.name+'" from '+plan.name+'?\n\nIts history is kept in Progress and on past dates. You can restore it from the Plans tab.')) return false;
    ex.archived=true;
  }

}

/* ---------- PLANS: the template editor ---------- */
function movePlanExercise(plan,i,dir){
  const act=plan.exercises.filter(x=>!x.archived), j=i+dir; if(j<0||j>=act.length) return;
  [act[i],act[j]]=[act[j],act[i]];
  plan.exercises=act.concat(plan.exercises.filter(x=>x.archived)); commit(); renderPlans();
  const row=$('content').querySelectorAll('.pl-row')[j], b=row&&row.querySelector(dir<0?'.up':'.down');
  if(b&&!b.disabled) b.focus();
}
/* One exercise per line; leading bullets or numbers ("- ", "1. ") are ignored so a pasted list works. */
const parseList=text=>text.split(/\r?\n/).map(l=>l.replace(/^\s*(?:[-*•·]|\d+[.)])\s*/,'').trim().slice(0,80)).filter(Boolean);
function quickAdd(plan,text){
  let added=0, restored=0, skipped=0;
  parseList(text).forEach(name=>{
    const ex=plan.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!ex){ plan.exercises.push({id:uid(), name, desc:'', kind:'weight', archived:false}); added++; }
    else if(ex.archived){ ex.archived=false; plan.exercises=plan.exercises.filter(x=>x!==ex).concat(ex); restored++; }
    else skipped++;
  });
  plan.exercises=plan.exercises.filter(x=>!x.archived).concat(plan.exercises.filter(x=>x.archived));
  commit(); renderPlans();
  toast([added&&'Added '+added, restored&&'restored '+restored, skipped&&skipped+' already in plan'].filter(Boolean).join(' · ')||'Nothing to add');
}
function renderPlans(){
  const c=$('content'); c.innerHTML='';
  const plan=planById(curPlan);
  if(!plan){ c.innerHTML='<div class="empty">Tap “+ Plan” to create your first workout plan,<br>then list its exercises here.</div>'; return; }
  const act=plan.exercises.filter(x=>!x.archived), gone=plan.exercises.filter(x=>x.archived);
  c.insertAdjacentHTML('beforeend','<div class="note">The exercises, in order, that every <b>'+esc(plan.name)+'</b> session starts with. Changes apply to every date except ones you reordered on the Log screen.</div>');
  const box=document.createElement('div'); box.className='pl-card';
  if(!act.length) box.innerHTML='<div class="empty" style="padding:20px">No exercises yet. Type them below, one per line.</div>';
  act.forEach((ex,i)=>{
    const row=document.createElement('div'); row.className='pl-row';
    row.innerHTML='<div class="pl-mv"><button class="up" aria-label="Move '+esc(ex.name)+' up"'+(i===0?' disabled':'')+'>▲</button><button class="down" aria-label="Move '+esc(ex.name)+' down"'+(i===act.length-1?' disabled':'')+'>▼</button></div>'+
      '<div class="pl-mid"><input type="text" class="pl-name" maxlength="80" autocomplete="off" aria-label="Exercise name" value="'+esc(ex.name)+'">'+
        '<div class="pl-sub"><select aria-label="Type of '+esc(ex.name)+'">'+Object.keys(KINDS).map(k=>'<option value="'+k+'"'+(k===ex.kind?' selected':'')+'>'+KINDS[k].label+'</option>').join('')+'</select>'+
        '<button class="pl-desc">'+(ex.desc? '✎ '+esc(ex.desc.split('\n')[0]) : '+ Description')+'</button></div></div>'+
      '<button class="pl-rm" aria-label="Remove '+esc(ex.name)+'">✕</button>';
    const inp=row.querySelector('.pl-name');
    inp.onchange=()=>{
      const n=inp.value.trim();
      if(!n||plan.exercises.some(x=>x!==ex&&x.name.toLowerCase()===n.toLowerCase())){ toast(n? 'That name is already used in this plan' : 'Name can’t be empty'); inp.value=ex.name; return; }
      if(n!==ex.name){ ex.name=n; commit(); toast('Renamed'); }
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') inp.blur(); });
    row.querySelector('select').onchange=e=>{ ex.kind=e.target.value; commit(); };
    row.querySelector('.pl-desc').onclick=()=>openExDialog(plan,ex);
    row.querySelector('.up').onclick=()=>movePlanExercise(plan,i,-1);
    row.querySelector('.down').onclick=()=>movePlanExercise(plan,i,1);
    row.querySelector('.pl-rm').onclick=()=>{ if(removeExercise(plan,ex)) renderPlans(); };
    box.appendChild(row);
  });
  c.appendChild(box);
  const qa=document.createElement('div'); qa.className='notes';
  qa.innerHTML='<label for="qaIn">Add exercises, one per line</label><textarea id="qaIn" rows="4" placeholder="Bench press&#10;Incline dumbbell press&#10;Dips"></textarea>'+
    '<button class="addex" style="margin-top:10px">+ Add to '+esc(plan.name)+'</button>';
  qa.querySelector('button').onclick=()=>{ const ta=qa.querySelector('textarea'); if(!parseList(ta.value).length){ ta.focus(); return; } quickAdd(plan,ta.value); };
  c.appendChild(qa);
  if(gone.length){
    const g=document.createElement('div'); g.className='notes';
    g.innerHTML='<label>Removed from this plan (history kept)</label>'+gone.map((ex,i)=>'<div class="arch"><span>'+esc(ex.name)+'</span><button data-i="'+i+'">Restore</button></div>').join('');
    g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const ex=gone[+b.dataset.i]; ex.archived=false; plan.exercises=plan.exercises.filter(x=>!x.archived).concat(plan.exercises.filter(x=>x.archived)); commit(); renderPlans(); toast('Restored'); });
    c.appendChild(g);
  }
}

/* ---------- rest timer ---------- */
const rest={end:0, timer:null, hideT:null, ctx:null};
const mmss=s=>Math.floor(s/60)+':'+pad(s%60);
function startRest(sec){
  sec=sec||db.settings.restSec; rest.end=Date.now()+sec*1000; ensureAudio();
  clearTimeout(rest.hideT); clearInterval(rest.timer);
  $('rest').classList.add('show'); $('rest').classList.remove('over'); $('hRest').classList.add('on');
  rest.timer=setInterval(tickRest,250); tickRest();
}
function tickRest(){
  if(!rest.timer) return;
  const left=Math.ceil((rest.end-Date.now())/1000);
  if(left<=0){
    clearInterval(rest.timer); rest.timer=null;
    $('restTime').textContent='Rest over'; $('rest').classList.add('over'); beep();
    try{ if(navigator.vibrate) navigator.vibrate([250,120,250]); }catch(e){}
    rest.hideT=setTimeout(stopRest,6000); return;
  }
  $('restTime').textContent=mmss(left);
}
function addRest(n){ if(!rest.timer){ startRest(Math.max(15,n)); return; } rest.end=Math.max(Date.now()+1000, rest.end+n*1000); tickRest(); }
function stopRest(){ clearInterval(rest.timer); rest.timer=null; clearTimeout(rest.hideT); $('rest').classList.remove('show','over'); $('hRest').classList.remove('on'); }
function ensureAudio(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!rest.ctx&&AC) rest.ctx=new AC(); if(rest.ctx&&rest.ctx.state==='suspended') rest.ctx.resume(); }catch(e){} }
function beep(){
  const ctx=rest.ctx; if(!ctx) return;
  try{ [0,0.28,0.56].forEach(t=>{ const o=ctx.createOscillator(), g=ctx.createGain(), t0=ctx.currentTime+t;
    o.frequency.value=880; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.3,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
    o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+0.22); }); }catch(e){}
}
$('hRest').onclick=()=>rest.timer? stopRest() : startRest();
$('restMinus').onclick=()=>addRest(-15);
$('restPlus').onclick=()=>addRest(15);
$('restStop').onclick=stopRest;

/* ---------- PROGRESS ---------- */
function niceTicks(lo,hi){
  if(hi-lo<1e-9){ hi=lo+1; lo=Math.max(0,lo-1); }
  const raw=(hi-lo)/3, mag=10**Math.floor(Math.log10(raw)), f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, t=[];
  for(let v=a; v<=b+step/2; v+=step) t.push(+v.toFixed(6));
  return t;
}
const fmtAxis=v=>v>=10000? Math.round(v/1000)+'k' : v>=1000? fmtNum(v/1000,1)+'k' : fmtNum(v,1);
const tip=$('tip');
function showTip(svg,W,vx,vy,html){
  const r=svg.getBoundingClientRect(), k=r.width/W;
  tip.innerHTML=html; tip.hidden=false;
  const x=Math.min(Math.max(r.left+vx*k, 70), window.innerWidth-70);
  tip.style.left=x+'px'; tip.style.top=(r.top+vy*k-10)+'px';
}
const hideTip=()=>{ tip.hidden=true; };

/* points: [{x:dayNum, v:display value, date, pr}] */
function lineChartEl(points,col,info){
  const W=320,H=160,L=38,R=12,T=12,B=24;
  const ticks=niceTicks(Math.min(...points.map(p=>p.v)),Math.max(...points.map(p=>p.v)));
  const lo=ticks[0], hi=ticks[ticks.length-1];
  const x0=points[0].x, x1=points[points.length-1].x, span=x1-x0;
  const X=x=>span? L+(x-x0)/span*(W-L-R) : L+(W-L-R)/2;
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';
  ticks.forEach(t=>{ const y=Y(t); g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#283149" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+3)+'" fill="#8a94ad" font-size="9" text-anchor="end">'+fmtAxis(t)+'</text>'; });
  const lbl=span>300? monYY : ddmm;
  const xl=[[points[0],'start']]; if(points.length>1) xl.push([points[points.length-1],'end']);
  if(points.length>2&&span>20){ const mid=points.reduce((a,p)=>Math.abs(p.x-(x0+span/2))<Math.abs(a.x-(x0+span/2))? p : a); if(X(mid.x)-L>50&&W-R-X(mid.x)>50) xl.push([mid,'middle']); }
  xl.forEach(([p,a])=>{ g+='<text x="'+X(p.x)+'" y="'+(H-6)+'" fill="#8a94ad" font-size="9" text-anchor="'+(points.length===1?'middle':a)+'">'+esc(lbl(p.date))+'</text>'; });
  if(points.length>1) g+='<polyline points="'+points.map(p=>X(p.x)+','+Y(p.v)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  points.forEach(p=>{
    if(p.pr) g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.v)+'" r="7" fill="none" stroke="#e9edf6" stroke-width="1.5"/>';
    g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.v)+'" r="4" fill="'+col+'" stroke="#151b2b" stroke-width="2"/>';
  });
  g+='<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="#8a94ad" stroke-width="1" visibility="hidden"/>';

  const wrap=document.createElement('div');

  const svg=wrap.firstChild, xh=svg.querySelector('.xh'), hl=svg.querySelector('.hl');

  const leave=()=>{ xh.setAttribute('visibility','hidden'); hl.setAttribute('visibility','hidden'); hideTip(); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);

/* weeks: [{start, v}] */
function barChartEl(weeks,col,unit){
  const W=320,H=130,L=38,R=12,T=10,B=22, n=weeks.length;
  const ticks=niceTicks(0,Math.max(...weeks.map(w=>w.v))), hi=ticks[ticks.length-1];
  const slot=(W-L-R)/n, bw=Math.min(24,slot-2);
  const Y=v=>T+(1-v/hi)*(H-T-B), base=Y(0);
  let g='';
  ticks.forEach(t=>{ const y=Y(t); g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#283149" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+3)+'" fill="#8a94ad" font-size="9" text-anchor="end">'+fmtAxis(t)+'</text>'; });
  weeks.forEach((w,i)=>{
    const cx=L+slot*(i+.5), x=cx-bw/2;
    if(w.v>0){ const y=Y(w.v), h=base-y, r=Math.min(4,h,bw/2);
      g+='<path d="M'+x+','+base+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+bw-r)+'Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+'V'+base+'Z" fill="'+col+'"/>'; }
    if(i===0||i===n-1||i===Math.floor(n/2)) g+='<text x="'+cx+'" y="'+(H-6)+'" fill="#8a94ad" font-size="9" text-anchor="middle">'+esc(ddmm(w.start))+'</text>';
  });
  g+='<rect class="hb" x="0" y="'+T+'" width="'+bw+'" height="'+(base-T)+'" fill="#e9edf6" opacity=".08" visibility="hidden"/>';
  g+='<rect x="'+L+'" y="0" width="'+(W-L-R)+'" height="'+H+'" fill="transparent"/>';
  const wrap=document.createElement('div');
  wrap.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weekly volume, last '+n+' weeks">'+g+'</svg>';
  const svg=wrap.firstChild, hb=svg.querySelector('.hb');
  const move=ev=>{
    const r=svg.getBoundingClientRect(), vx=(ev.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(n-1,Math.floor((vx-L)/slot))), w=weeks[i], cx=L+slot*(i+.5);
    hb.setAttribute('x',cx-bw/2); hb.setAttribute('visibility','visible');
    showTip(svg,W,cx,Math.min(Y(w.v),base-10),esc(fmtBig(w.v)+' '+unit)+'<small>Week of '+esc(shortDate(w.start))+'</small>');
  };
  const leave=()=>{ hb.setAttribute('visibility','hidden'); hideTip(); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',leave); svg.addEventListener('pointercancel',leave);
  return svg;
}

/* Least-squares trend over the last few sessions, so one odd day doesn't swing the number. */
function trend(points){
  const p=points.slice(-8); if(p.length<2) return null;
  if(p.length===2) return {d:p[1].v-p[0].v, n:2};
  const mx=p.reduce((a,q)=>a+q.x,0)/p.length, my=p.reduce((a,q)=>a+q.v,0)/p.length;
  let sxy=0,sxx=0; p.forEach(q=>{ sxy+=(q.x-mx)*(q.v-my); sxx+=(q.x-mx)**2; });
  return {d:sxx? sxy/sxx*(p[p.length-1].x-p[0].x) : 0, n:p.length};
}
function renderProgress(){
  const c=$('content'); c.innerHTML='';
  const mb=document.createElement('div'); mb.className='ctrl';
  mb.innerHTML=[['e1rm','Strength'],['top','Top set'],['vol','Volume']].map(([k,l])=>'<button data-m="'+k+'" class="'+(metric===k?'active':'')+'">'+l+'</button>').join('');
  mb.querySelectorAll('button').forEach(b=>b.onclick=()=>{ metric=b.dataset.m; render(); });
  const rb=document.createElement('div'); rb.className='ctrl range';
  rb.innerHTML=[['3m','3 months'],['6m','6 months'],['1y','1 year'],['all','All']].map(([k,l])=>'<button data-r="'+k+'" class="'+(range===k?'active':'')+'">'+l+'</button>').join('');
  rb.querySelectorAll('button').forEach(b=>b.onclick=()=>{ range=b.dataset.r; render(); });
  c.appendChild(mb); c.appendChild(rb);
  const note=document.createElement('div'); note.className='note';
  note.textContent={e1rm:'Strength = estimated 1-rep max from your best working set (Epley). Bodyweight and timed exercises show their best set.',
    top:'Top set = heaviest working set that day. Bodyweight and timed exercises show their best set.',
    vol:'Volume = weight × reps over working sets (warm-ups excluded). Bodyweight and timed exercises show total reps or seconds.'}[metric]+' Ringed points are personal bests.';
  c.appendChild(note);
  const cutoff=dayNum(todayStr())-RANGES[range];
  let any=false;
  const plans=db.plans.filter(p=>!p.archived).concat(db.plans.filter(p=>p.archived));
  plans.forEach(plan=>{
    const charts=[];
    plan.exercises.forEach(ex=>{
      const hist=exHistory(plan.id,ex); if(!hist.length) return;
      const info=metricInfo(ex,metric); let run=0;
      const all=hist.map((h,i)=>{ const v=info.weight? toDisp(h[metric]) : h[metric]; const pr=i>0&&v>run+1e-9; run=Math.max(run,v); return {x:dayNum(h.date), v, date:h.date, pr}; });
      const pts=all.filter(p=>p.x>=cutoff);
      if(pts.length) charts.push({ex,info,pts,best:run});
    });
    if(!charts.length) return;
    any=true;
    const ph=document.createElement('div'); ph.className='prog-plan';
    ph.innerHTML='<span class="pdot" style="background:'+plan.color+'"></span>'+esc(plan.name)+(plan.archived?' <span class="tag">archived</span>':'');
    c.appendChild(ph);
    // weekly volume for the plan's weighted exercises, last 12 weeks
    const weeks=[]; let m=mondayOf(todayStr());
    for(let i=0;i<12;i++){ weeks.unshift({start:m,v:0}); m=shiftDay(m,-7); }
    const wIdx=new Map(weeks.map((w,i)=>[w.start,i]));
    allDates().forEach(d=>{ const i=wIdx.get(mondayOf(d)); const e=db.log[d][plan.id]; if(i==null||!e) return;
      plan.exercises.forEach(ex=>{ if(ex.kind!=='weight'||!e.ex[ex.id]) return; const st=sessionStats(ex,e.ex[ex.id]); if(st) weeks[i].v+=toDisp(st.vol); }); });
    if(weeks.some(w=>w.v>0)){
      const card=document.createElement('div'); card.className='chart-card';
      const tot=weeks.slice(-4).reduce((a,w)=>a+w.v,0);
      card.innerHTML='<div class="ctitle"><b>Weekly volume</b></div><div class="csub">Weighted exercises, last 12 weeks · last 4 weeks avg '+esc(fmtBig(tot/4))+' '+U()+'/week</div>';
      card.appendChild(barChartEl(weeks,plan.color,U()));
      tableToggle(card,weeks.map(w=>[ddmm(w.start),fmtBig(w.v)]),['Week of','Volume ('+U()+')']);
      c.appendChild(card);
    }
    charts.forEach(({ex,info,pts,best})=>{
      const last=pts[pts.length-1], tr=trend(pts);
      let delta='';
      if(tr){ const up=tr.d>1e-9, dn=tr.d<-1e-9;
        delta='<span class="delta" style="color:'+(up?'var(--accent2)':dn?'var(--danger)':'var(--muted)')+'" title="Trend over the last '+tr.n+' sessions">'+(up?'▲ +':dn?'▼ ':'■ ')+esc(fmtBig(tr.d)+' '+info.unit)+'</span>'; }
      const card=document.createElement('div'); card.className='chart-card';
      card.innerHTML='<div class="ctitle"><b>'+esc(ex.name)+(ex.archived?' <span class="tag" style="font-size:11px;color:var(--muted)">archived</span>':'')+'</b>'+delta+'</div>'+
        '<div class="csub">'+esc(info.label)+' · '+pts.length+' session'+(pts.length>1?'s':'')+' · latest '+esc(fmtBig(last.v)+' '+info.unit)+' · best '+esc(fmtBig(best)+' '+info.unit)+(tr?' · trend over last '+tr.n:'')+'</div>';
      card.appendChild(lineChartEl(pts,plan.color,info));
      tableToggle(card,pts.map(p=>[ddmm(p.date),fmtBig(p.v)+(p.pr?' 🏆':'')]),['Date',info.label+' ('+info.unit+')']);
      c.appendChild(card);
    });
  });
  if(!any) c.insertAdjacentHTML('beforeend','<div class="empty">No data '+(range==='all'?'yet':'in this period')+'.<br>Log a few workouts and your progress charts will appear here.</div>');
}

/* ---------- backup ---------- */
function download(name,text){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
async function exportBackup(){
  save();
  const name='gym-tracker-backup-'+todayStr()+'.json', text=JSON.stringify(db);
  let done=false;
  try{
    const file=new File([text],name,{type:'application/json'});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Gym Tracker backup'}); done=true; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  if(!done) download(name,text);
  db.settings.backupAt=todayStr(); db.settings.backupCount=sessionCount(); commit();
  toast('Backup exported'); if($('setsDlg').open) renderSettings(); if(view==='log') renderLog();
}
function importBackup(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let d; try{ d=sanitize(JSON.parse(rd.result)); }catch(e){ alert('Could not import this file.\n\n'+(e instanceof SyntaxError? 'It is not valid JSON.' : e.message)); return; }
    if(!confirm('Replace the data on this device with this backup?\n\nBackup: '+sessionCount(d)+' sessions, '+d.plans.length+' plans.\nThis device: '+sessionCount()+' sessions, '+db.plans.length+' plans.\n\nYour current data is kept and can be brought back from Settings.')) return;
    if(!keepPrev()&&!confirm('There is not enough space to keep a copy of the current data. Import anyway?')) return;
    db=d; db.settings.backupAt=todayStr(); db.settings.backupCount=sessionCount();
    curPlan=null; fixCurPlan(); commit(); $('setsDlg').close(); render(); toast('Backup imported');
  };
  rd.readAsText(file);
}

function readPrev(){ try{ const p=JSON.parse(localStorage.getItem(PREV_STORE)); return p&&p.db? {savedAt:p.savedAt, db:sanitize(p.db)} : null; }catch(e){ return null; } }

    const ds=year+'-'+pad(month+1)+'-'+pad(day), plans=dayPlans(ds).map(planById);
    let cls='cal-day'; if(plans.length) cls+=' has'; if(ds===today) cls+=' today'; if(ds===curDate) cls+=' sel';
    const dots=plans.slice(0,4).map(p=>'<i style="background:'+p.color+'"></i>').join('');
    html+='<button class="'+cls+'" data-d="'+ds+'" aria-label="'+esc(fullDate(ds)+(plans.length?': '+plans.map(p=>p.name).join(', '):''))+'">'+day+(dots?'<span class="dots">'+dots+'</span>':'')+'</button>';
  }
  const grid=$('calGrid'); grid.innerHTML=html;
  grid.querySelectorAll('.cal-day').forEach(b=>b.onclick=()=>pickDate(b.dataset.d));
}

/* ---------- master render + events ---------- */
function render(){
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const isLog=view==='log';
  if(view==='plans'){ const p=planById(curPlan); if(!p||p.archived){ const a=db.plans.find(q=>!q.archived); curPlan=a? a.id : null; } }
  else if(isLog) fixCurPlan();
  $('daynav').style.display=isLog? 'flex' : 'none';
  $('hPdf').style.display=isLog&&curPlan? '' : 'none';
  hideTip(); renderTabs(); renderPlanBar();
  if(isLog){ renderLog(); renderDate(); } else if(view==='plans') renderPlans(); else renderProgress();
}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{ view=b.dataset.view; render(); });
$('prevDay').onclick=()=>{ curDate=shiftDay(curDate,-1); fixCurPlan(); render(); };
$('nextDay').onclick=()=>{ curDate=shiftDay(curDate,1); fixCurPlan(); render(); };
$('dateBtn').onclick=openCal;
$('calPrev').onclick=()=>shiftMonth(-1);
$('calNext').onclick=()=>shiftMonth(1);
$('calClose').onclick=()=>$('calDlg').close();
$('calToday').onclick=()=>pickDate(todayStr());
$('hPdf').onclick=exportPlanPDF;
window.addEventListener('scroll',hideTip,{passive:true});

/* Flush pending saves when the app is hidden; if it was left open overnight on "today", move to the new today. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ if(saveT) save(); return; }
  const t=todayStr(); if(t!==lastToday){ if(curDate===lastToday){ curDate=t; fixCurPlan(); render(); } lastToday=t; }
  tickRest();
});
window.addEventListener('pagehide',()=>{ if(saveT) save(); });

/* ---------- util ---------- */
let toastT;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- boot ---------- */
render();
if(bootNote==='migrated'){ if(commit()) toast('Data upgraded · the old copy is kept too'); }
else if(bootNote==='unreadable'){ alert('Your saved data could not be read, so the app started empty. A copy of the unreadable data was kept on this device. Import a backup from Settings to restore it.'); }
else if(bootNote==='blocked'){ $('saveErrTxt').textContent='This browser is blocking storage (private mode?), so nothing you log will be kept.'; $('saveErr').hidden=false; }
askPersist();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
