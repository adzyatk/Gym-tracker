<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{color-scheme:light dark;
    --tint:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
    --bg:#f2f2f7; --cell:#fff; --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.2); --segOn:#fff;
    --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
    --bar:rgba(242,242,247,.8); --glass:rgba(255,255,255,.7); --glassEdge:rgba(255,255,255,.65); --sheet:rgba(250,250,252,.96);
    --done:rgba(52,199,89,.13); --shadow:0 10px 30px rgba(0,0,0,.12); --tabB:calc(env(safe-area-inset-bottom) * .55 + 8px);}
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --tint:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
    --bg:#000; --cell:#1c1c1e; --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.36); --segOn:#636366;
    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
    --bar:rgba(0,0,0,.75); --glass:rgba(38,38,40,.72); --glassEdge:rgba(255,255,255,.09); --sheet:rgba(44,44,46,.97);
    --done:rgba(48,209,88,.16); --shadow:0 10px 30px rgba(0,0,0,.55);} }
  :root[data-theme=dark]{
    --tint:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
    --bg:#000; --cell:#1c1c1e; --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.36); --segOn:#636366;
    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
    --bar:rgba(0,0,0,.75); --glass:rgba(38,38,40,.72); --glassEdge:rgba(255,255,255,.09); --sheet:rgba(44,44,46,.97);
    --done:rgba(48,209,88,.16); --shadow:0 10px 30px rgba(0,0,0,.55);}
  :root[data-theme=light]{color-scheme:light;} :root[data-theme=dark]{color-scheme:dark;}

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--bg); color:var(--label); font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; letter-spacing:-.41px;
    -webkit-font-smoothing:antialiased; touch-action:manipulation; padding:0 env(safe-area-inset-right) calc(var(--tabB) + 96px) env(safe-area-inset-left);}
  body.resting{padding-bottom:calc(var(--tabB) + 166px);}
  button{font:inherit; letter-spacing:inherit; color:inherit; cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  button:disabled{cursor:default;}
  :focus-visible{outline:2px solid var(--tint); outline-offset:2px;}
  .ic{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto;}
  .ic .f{fill:currentColor; stroke:none;}
  .ic.sm{width:20px; height:20px;} .ic.xs{width:14px; height:14px; stroke-width:2.6;}
  main{max-width:640px; margin:0 auto;}

  /* navigation bar + large title */
  .nav{position:sticky; top:0; z-index:30; padding-top:env(safe-area-inset-top); transition:background .2s, box-shadow .2s;}
  .nav.scrolled{background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); box-shadow:0 .5px 0 var(--sep);}
  .nav-in{max-width:640px; margin:0 auto; height:44px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 6px;}
  .nav-side{display:flex; align-items:center;} .nav-side.r{justify-content:flex-end;}
  .nav-title{font-weight:600; font-size:17px; opacity:0; transition:opacity .2s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:56vw;}
  .nav.scrolled .nav-title{opacity:1;}
  .icon-btn{width:44px; height:44px; border:0; background:none; color:var(--tint); display:grid; place-items:center; border-radius:22px; padding:0;}
  .icon-btn:active{opacity:.4;}
  body.resting #hRest{color:var(--green);}
  .large{display:flex; align-items:flex-end; gap:10px; padding:0 16px 2px;}
  .large h1{margin:0; font-size:34px; line-height:41px; font-weight:700; letter-spacing:.37px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .large .lt{flex:1; min-width:0; border:0; background:none; padding:0; text-align:left;}
  .large .lt:active{opacity:.5;}
  .step{display:flex; gap:8px; padding-bottom:5px;}
  .round{width:34px; height:34px; border-radius:17px; border:0; background:var(--fill); color:var(--tint); display:grid; place-items:center; padding:0;}
  .round .ic{width:20px; height:20px; stroke-width:2.4;}
  .round:active{opacity:.5;}
  .sub{padding:0 16px; font-size:15px; color:var(--label2); display:flex; align-items:center; flex-wrap:wrap; gap:4px 6px; min-height:22px;}
  .sub .dots{display:inline-flex; gap:3px;} .sub .dots i{width:8px; height:8px; border-radius:50%;}
  .link{border:0; background:none; color:var(--tint); padding:0; font-size:inherit;}
  .link:active{opacity:.5;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:12px 16px 14px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; height:34px; padding:0 14px; border-radius:17px; border:0; background:var(--cell); color:var(--label); font-size:15px; font-weight:500; display:flex; align-items:center; gap:7px; box-shadow:0 0 0 .5px var(--sep);}
  .chip i{width:9px; height:9px; border-radius:50%;}
  .chip.on{background:var(--tint); color:#fff; box-shadow:none;}
  .chip.on i{box-shadow:0 0 0 1.5px #fff;}
  .chip.arch{font-style:italic;}
  .chip.add{background:none; color:var(--tint); box-shadow:inset 0 0 0 1px var(--fill2); gap:4px;}
  .chip.add .ic{width:16px; height:16px; stroke-width:2.6;}
  .chip:active{opacity:.6;}

  /* grouped lists */
  .group-h{font-size:13px; line-height:18px; letter-spacing:-.08px; text-transform:uppercase; color:var(--label2); padding:22px 32px 7px; display:flex; align-items:center; gap:7px;}
  .group-h i{width:10px; height:10px; border-radius:50%;}
  .group-f{font-size:13px; line-height:18px; letter-spacing:-.08px; color:var(--label2); padding:7px 32px 0;}
  .group{background:var(--cell); border-radius:12px; margin:0 16px; overflow:hidden;}
  .group+.group{margin-top:20px;}
  .row{display:flex; align-items:center; gap:12px; min-height:44px; padding:6px 16px; position:relative; background:var(--cell); width:100%; border:0; text-align:left; font-size:17px; color:var(--label);}
  .group>.swipe:not(:last-child)::after{content:''; position:absolute; z-index:2; left:52px; right:0; bottom:0; height:1px; transform:scaleY(.5); transform-origin:bottom; background:var(--sep); pointer-events:none;}
  .group>.row:not(:last-child)::after{content:''; position:absolute; left:16px; right:0; bottom:0; height:1px; transform:scaleY(.5); transform-origin:bottom; background:var(--sep);}
  .row .lbl{flex:1; min-width:0;}
  .row .val{color:var(--label2); font-variant-numeric:tabular-nums;}
  .row.btn:active,.row-main:active{background:var(--fill);}
  .row.tint{color:var(--tint);} .row.tint .ic{color:var(--tint);}
  .row.destructive{color:var(--red);} .row.center{justify-content:center; text-align:center;}
  .row .chev{width:16px; height:16px; color:var(--label3); stroke-width:2.6;}
  .row .muted{color:var(--label2);}
  .cell-input{display:block; width:100%; border:0; background:var(--cell); color:var(--label); font:inherit; padding:12px 16px; min-height:44px; resize:none;}
  textarea.cell-input{line-height:1.35;}
  .cell-input:focus{outline:none;}
  .cell-input::placeholder{color:var(--label3);}
  .group>.cell-input+.row::before{content:''; position:absolute; left:16px; right:0; top:0; height:.5px; background:var(--sep);}
  .num-in{width:76px; border:0; background:var(--fill); border-radius:8px; height:34px; text-align:right; padding:0 10px; color:var(--label); font:inherit; font-variant-numeric:tabular-nums;}
  .num-in:focus{outline:none; box-shadow:0 0 0 2px var(--tint);}
  .unit{color:var(--label2); min-width:22px;}
  .pill{flex:0 0 auto; height:30px; padding:0 14px; border-radius:15px; border:0; background:var(--tint); color:#fff; font-size:15px; font-weight:600;}
  .pill.soft{background:var(--fill); color:var(--tint);} .pill.danger{background:none; color:var(--red);}
  .pill:active{opacity:.6;}
  .switch{-webkit-appearance:none; appearance:none; width:51px; height:31px; border-radius:16px; background:var(--fill2); position:relative; margin:0; flex:0 0 auto; transition:background .25s; cursor:pointer;}
  .switch::after{content:''; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06); transition:transform .25s cubic-bezier(.3,.9,.3,1);}
  .switch:checked{background:var(--green);} .switch:checked::after{transform:translateX(20px);}
  .stepper{display:flex; background:var(--fill); border-radius:8px; overflow:hidden;}
  .stepper button{width:46px; height:32px; border:0; background:none; font-size:22px; line-height:1; color:var(--label);}
  .stepper button+button{box-shadow:inset .5px 0 0 var(--sep);}
  .stepper button:active{background:var(--fill2);}
  .seg{display:flex; flex:1; background:var(--fill); border-radius:9px; padding:2px; gap:2px;}
  .seg button{flex:1; min-width:0; height:30px; border:0; background:none; border-radius:7px; font-size:13px; font-weight:500; color:var(--label); letter-spacing:-.08px; white-space:nowrap;}
  .seg button.on{background:var(--segOn); font-weight:600; box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);}
  .footnote{font-size:13px; color:var(--label2); text-align:center; padding:4px 32px 16px; line-height:1.6;}
  .ver{padding-top:28px;}

  /* exercise cards */
  .card{background:var(--cell); border-radius:14px; margin:0 16px 16px; overflow:hidden;}
  .card-h{display:flex; align-items:flex-start; gap:4px; padding:12px 4px 6px 16px;}
  .card-h .t{flex:1; min-width:0; padding-top:4px;}
  .card-h h3{margin:0; font-size:17px; font-weight:600; color:var(--tint); overflow-wrap:anywhere;}
  .card-h .tags{display:flex; gap:6px; margin-top:4px;}
  .tag{font-size:12px; font-weight:600; color:var(--label2); background:var(--fill); border-radius:6px; padding:2px 7px;}
  .card-h .desc{margin:4px 0 0; font-size:13px; color:var(--label2); white-space:pre-wrap; letter-spacing:-.08px;}
  .card-h .more{margin-top:-6px;}
  .sets-h,.set{display:grid; grid-template-columns:34px minmax(0,1fr) 76px 64px 40px; gap:6px; align-items:center; padding:0 12px;}
  .sets-h{height:26px; font-size:12px; font-weight:600; color:var(--label2); text-transform:uppercase; letter-spacing:0;}
  .sets-h span{text-align:center;} .sets-h span:nth-child(2){text-align:left; padding-left:4px;}
  .sets-h .ic{vertical-align:-2px;}
  .swipe{position:relative; overflow:hidden;}
  .swipe-del{position:absolute; top:0; right:0; bottom:0; width:96px; border:0; background:var(--red); color:#fff; font-size:15px; font-weight:600; padding-left:12px;}
  .slide{position:relative; z-index:1; touch-action:pan-y;}
  .set{height:50px; background:var(--cell);}
  .set.done{background:linear-gradient(var(--done),var(--done)),var(--cell);}
  .set .no{width:30px; height:28px; justify-self:center; border:0; border-radius:8px; background:var(--fill); font-size:15px; font-weight:600; padding:0; font-variant-numeric:tabular-nums;}
  .set.warm .no{color:var(--orange);}
  .set .prev{border:0; background:none; padding:0 4px; height:34px; text-align:left; font-size:15px; color:var(--label2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums;}
  .set .prev:disabled{color:var(--label3);}
  .set .prev:not(:disabled):active{color:var(--tint);}
  .set input{width:100%; height:34px; border:0; border-radius:8px; background:var(--fill); color:var(--label); font:600 17px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; text-align:center; padding:0 4px; font-variant-numeric:tabular-nums; transition:background .2s;}
  .set input::placeholder{color:var(--label3); font-weight:500;}
  .set input:focus{outline:none; box-shadow:0 0 0 2px var(--tint);}
  .set.done input{background:transparent;}
  .set.warm input{color:var(--label2);}
  .set .chk{width:36px; height:30px; justify-self:center; border:0; border-radius:8px; background:var(--fill); color:var(--label3); display:grid; place-items:center; padding:0; transition:background .2s, color .2s, transform .1s;}
  .set .chk .ic{width:18px; height:18px; stroke-width:3;}
  .set .chk:active{transform:scale(.9);}
  .set.done .chk{background:var(--green); color:#fff;}
  .set .prb{position:absolute; top:3px; right:44px; font-size:12px; line-height:1; pointer-events:none;}
  .card-f{display:flex; gap:8px; padding:8px 12px 12px;}
  .add-set{flex:1; height:36px; border:0; border-radius:10px; background:var(--fill); color:var(--label); font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:4px;}
  .add-set.tint{color:var(--tint);}
  .add-set .ic{width:18px; height:18px; stroke-width:2.6;}
  .add-set:active{opacity:.6;}
  .banner{display:flex; align-items:center; gap:12px; background:var(--cell); border-radius:14px; margin:0 16px 16px; padding:12px 14px;}
  .banner .bi{width:36px; height:36px; border-radius:10px; background:var(--orange); color:#fff; display:grid; place-items:center; flex:0 0 auto;}
  .banner .bi .ic{width:20px; height:20px;}
  .banner .bt{flex:1; min-width:0; display:flex; flex-direction:column; font-size:15px; letter-spacing:-.24px;}
  .banner .bt span{color:var(--label2); font-size:13px; letter-spacing:-.08px;}
  .empty{text-align:center; padding:56px 32px 24px; color:var(--label2);}
  .empty .ei{color:var(--label3); display:flex; justify-content:center; margin-bottom:12px;}
  .empty .ei .ic{width:56px; height:56px; stroke-width:1.5;}
  .empty h2{color:var(--label); font-size:22px; font-weight:700; margin:0 0 6px; letter-spacing:.35px;}
  .empty p{margin:0 0 20px; font-size:15px; line-height:1.4;}
  .btn-fill{height:50px; padding:0 28px; border:0; border-radius:14px; background:var(--tint); color:#fff; font-size:17px; font-weight:600;}
  .btn-fill:active{opacity:.7;}

  /* plans list */
  .list .row{min-height:60px; gap:6px; padding:0 8px 0 0;}
  .grip{width:44px; height:58px; display:grid; place-items:center; color:var(--label3); touch-action:none; cursor:grab; flex:0 0 auto;}
  .row-main{flex:1; min-width:0; border:0; background:none; text-align:left; padding:8px 0; display:flex; flex-direction:column; border-radius:8px;}
  .row-main .lbl{font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-main .rsub{font-size:13px; color:var(--label2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.08px;}
  .list .swipe{transition:transform .22s cubic-bezier(.2,.8,.2,1);}
  .list .swipe.dragging{transition:none; z-index:5; box-shadow:var(--shadow); border-radius:12px;}
  .list .swipe.dragging .row{background:var(--cell);}
  .cpick{width:34px; height:34px; padding:0; border:0; border-radius:17px; background:none; -webkit-appearance:none; appearance:none; cursor:pointer;}
  .cpick::-webkit-color-swatch-wrapper{padding:0;} .cpick::-webkit-color-swatch{border:none; border-radius:17px;}
  .cpick::-moz-color-swatch{border:none; border-radius:17px;}

  /* progress */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:6px 16px 0;}
  .tile{background:var(--cell); border-radius:14px; padding:12px 12px 10px; display:flex; flex-direction:column; min-width:0;}
  .tile .tl{font-size:13px; font-weight:600; color:var(--label2); letter-spacing:-.08px;}
  .tile b{font-size:24px; font-weight:700; letter-spacing:.2px; margin:4px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tile .ts{font-size:12px; color:var(--label2);}
  .ctl{display:flex; flex-direction:column; gap:8px; margin:16px 16px 0;}
  .chart{background:var(--cell); border-radius:14px; margin:0 16px 12px; padding:14px 14px 8px;}
  .ch-t{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .ch-t h3{margin:0; font-size:17px; font-weight:600; overflow-wrap:anywhere;}
  .delta{font-size:15px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .ch-s{font-size:13px; color:var(--label2); margin:2px 0 10px; letter-spacing:-.08px;}
  .chart svg{width:100%; height:auto; display:block; overflow:visible; touch-action:pan-y;}
  .g-grid{stroke:var(--sep); stroke-width:1;} .g-txt{fill:var(--label2);} .g-ring{stroke:var(--cell); stroke-width:2;}
  .g-pr{fill:none; stroke:var(--label); stroke-width:1.5;} .g-hl{stroke:var(--label); stroke-width:2;} .g-xh{stroke:var(--label3); stroke-width:1;} .g-hb{fill:var(--label); opacity:.07;}
  .tbtn{border:0; background:none; color:var(--tint); font-size:15px; padding:8px 0 4px;}
  .mini{width:100%; border-collapse:collapse; font-size:15px; margin:4px 0 6px; font-variant-numeric:tabular-nums;}
  .mini th,.mini td{padding:7px 4px; border-bottom:.5px solid var(--sep); text-align:right;}
  .mini th:first-child,.mini td:first-child{text-align:left;}
  .mini th{color:var(--label2); font-weight:600; font-size:12px; text-transform:uppercase;}
  .tip{position:fixed; z-index:70; pointer-events:none; background:var(--sheet); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); color:var(--label); font-size:15px; font-weight:600; padding:7px 11px; border-radius:10px; box-shadow:var(--shadow); white-space:nowrap; transform:translate(-50%,-100%); font-variant-numeric:tabular-nums;}
  .tip small{display:block; color:var(--label2); font-weight:400; font-size:12px;}

  /* floating tab bar */
  .tabbar{position:fixed; z-index:40; left:50%; transform:translateX(-50%); bottom:var(--tabB); width:min(calc(100% - 32px), 480px); height:64px; display:flex; padding:4px;
    border-radius:32px; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px); box-shadow:var(--shadow), inset 0 0 0 .5px var(--glassEdge);}
  .tabbar button{flex:1; border:0; background:none; border-radius:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--label); font-size:10px; font-weight:600; letter-spacing:.1px; transition:background .2s, color .2s;}
  .tabbar button .ic{width:26px; height:26px; stroke-width:1.9;}
  .tabbar button.on{color:var(--tint); background:var(--fill);}
  .tabbar button:active{transform:scale(.94);}
  body.kb .tabbar,body.kb #rest{opacity:0; pointer-events:none;}

  /* rest timer */
  #rest{position:fixed; z-index:39; left:50%; bottom:calc(var(--tabB) + 74px); transform:translate(-50%,24px); opacity:0; pointer-events:none; transition:transform .3s cubic-bezier(.2,.9,.3,1.1), opacity .2s;
    width:min(calc(100% - 32px), 480px); height:58px; display:flex; align-items:center; gap:8px; padding:0 8px 0 20px; border-radius:29px; overflow:hidden;
    background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px); box-shadow:var(--shadow), inset 0 0 0 .5px var(--glassEdge);}
  #rest.show{transform:translate(-50%,0); opacity:1; pointer-events:auto;}
  #rest .rest-bar{position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--tint); transform-origin:left; transition:transform .25s linear;}
  #rest.over .rest-bar{background:var(--green);}
  #rest .rl{font-size:13px; font-weight:600; color:var(--label2);}
  #rest b{flex:1; font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:0;}
  #rest.over b{color:var(--green); font-size:19px;}
  #rest button{height:40px; min-width:52px; border-radius:20px; border:0; background:var(--fill); color:var(--label); font-weight:600; font-size:15px; display:grid; place-items:center; padding:0 10px;}
  #rest button .ic{width:18px; height:18px; stroke-width:2.6;}
  #rest button:active{opacity:.6;}

  /* toast (top banner) */

<script>
'use strict';
/* ---------- constants ---------- */
const STORE='gymtracker_v2', OLD_STORE='gymtracker_v1', PREV_STORE='gymtracker_v2_prev', BAD_STORE='gymtracker_v2_unreadable';
const SCHEMA=2;
const APP_VERSION='2.5.0';   // keep in step with VERSION in sw.js
const PALETTE=['#4f8cff','#2bd47a','#ff5c6c','#ffb84f','#b07cff','#4fd6e0','#ff7cc4','#9ad44f'];
const KG_PER_LB=0.45359237;
const KINDS={ weight:{label:'Weighted',w:'Weight',r:'Reps'}, body:{label:'Bodyweight',w:'Added',r:'Reps'}, time:{label:'Timed',w:'Added',r:'Seconds'} };
const okKind=k=>k==='weight'||k==='body'||k==='time';
/* An exercise's own rest time in seconds, or null to use the default from Settings. */
function cleanRest(v){ v=num(v); return v!=null&&v>=15&&v<=900? Math.round(v) : null; }
const BACKUP_EVERY=5;
const RANGES={'3m':91,'6m':182,'1y':365,all:Infinity};

/* ---------- small utils ---------- */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const pad=n=>String(n).padStart(2,'0');
function uid(){ return (Math.random().toString(36).slice(2,10)+Date.now().toString(36)).replace(/[^a-z0-9]/g,'').slice(0,16); }
const isId=s=>typeof s==='string'&&/^[a-z0-9]{4,40}$/.test(s);
const validColor=c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)? c.toLowerCase() : null;
const clampStr=(s,n)=>typeof s==='string'? s.slice(0,n) : '';
function num(v){ if(v===null||v===undefined||v==='') return null; const x=typeof v==='number'? v : parseFloat(String(v).trim().replace(',','.')); return isFinite(x)&&x>=0&&x<100000? x : null; }
const isDateStr=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
function fmtNum(v,dp=2){ if(v==null||!isFinite(v)) return ''; const f=10**dp; return String(Math.round(v*f)/f); }
function fmtBig(v){ return (Math.round(v*10)/10).toLocaleString('en-GB',{maximumFractionDigits:1}); }
function sameArr(a,b){ return a.length===b.length&&a.every((x,i)=>x===b[i]); }

/* ---------- dates (always local time, never UTC) ---------- */
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d,12); }
function shiftDay(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
const dayNum=s=>{ const [y,m,d]=s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/86400000); };
const fullDate=s=>parseYmd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
const shortDate=s=>parseYmd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const ddmm=s=>parseYmd(s).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'});
const monYY=s=>parseYmd(s).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
const firstOfMonth=s=>s.slice(0,8)+'01';
function mondayOf(s){ const d=parseYmd(s); d.setDate(d.getDate()-(d.getDay()+6)%7); return ymd(d); }

/* ---------- units ---------- */
const U=()=>db.settings.unit;
const toDisp=kg=>kg==null? null : (U()==='lb'? kg/KG_PER_LB : kg);
const fromDisp=v=>v==null? null : (U()==='lb'? v*KG_PER_LB : v);
const fmtW=kg=>fmtNum(toDisp(kg));

/* ---------- data model ----------
   plans: [{id, name, color, archived, exercises:[{id, name, desc, kind, archived}]}]
   log:   { 'YYYY-MM-DD': { planId: { ex:{ exId:[{w(kg)|null, r|null, warm, done}] }, order?:[exId], note? } } }
   Weights are always stored in kg; lb is a display setting. */
function defaultSettings(){ return {unit:'kg', backoff:true, backoffPct:80, roundKg:2.5, roundLb:5, restSec:120, restAuto:true, upNext:true, theme:'system', backupAt:null, backupCount:0}; }
/* Default program: a machine-focused Push / Pull / Legs / Upper / Lower split (rest days Thu and Sun).
   Each entry is [name, kind, rest in seconds, target]; the target shows under the exercise name.
   "Top set + back-offs" lines up with Add Set, which suggests back-offs at the Settings percentage. */
const TOP=(n,top,back)=>'Top set + '+n+' back-off'+(n>1?'s':'')+' · '+top+', back-off'+(n>1?'s':'')+' '+back;
const DEFAULT_PROGRAM=[
  ['Push',[
    ['Smith Machine Incline Press','weight',180,TOP(2,'6–8','8–12')],
    ['Pin-Loaded Flat Chest Press','weight',150,TOP(1,'8–10','10–12')],
    ['Plate-Loaded Shoulder Press','weight',150,TOP(1,'6–10','10–12')],
    ['Single-Arm Pec Fly','weight',90,'2 sets · 12–15'],
    ['Cuffed Cable Lateral Raise','weight',60,'3 sets · 12–20'],
    ['JM Press (Smith)','weight',120,'2 sets · 8–12'],
    ['Single-Arm Cuffed Pushdown','weight',60,'2 sets · 12–15']]],
  ['Pull',[
    ['Plate-Loaded Iso-Lateral Front Lat Pulldown','weight',150,TOP(2,'6–10','10–12')],
    ['Single-Arm Lat Row','weight',120,'2 sets · 8–12'],
    ['Wide Grip Row','weight',120,'2 sets · 8–12 · elbows out, upper back'],
    ['Plate-Loaded Lat Pullover','weight',90,'2 sets · 10–15'],
    ['Rear Delt Fly','weight',60,'3 sets · 12–20'],
    ['Shrugs','weight',90,'2 sets · 10–15'],
    ['Single-Arm Preacher Curl','weight',90,'3 sets · 8–12'],
    ['Cuffed Forearm Curl','weight',60,'2 sets · 12–20 · optional']]],
  ['Legs',[
    ['Squat Press','weight',180,TOP(2,'6–10','10–12')],
    ['Leg Extensions','weight',90,'3 sets · 10–15'],
    ['Seated Hamstring Curl','weight',90,'3 sets · 8–12'],
    ['Hyperextensions','body',90,'2 sets · 10–15 · hold a plate once bodyweight gets easy'],
    ['Adductors','weight',60,'2 sets · 10–15'],
    ['Calf Raise','weight',90,'3 sets · 8–12 · pause in the stretch'],
    ['Ab Crunch Machine','weight',60,'2 sets · 10–15']]],
  ['Upper',[
    ['Machine Lat Pulldown','weight',150,TOP(1,'6–10','10–12')],
    ['Flat Chest Press','weight',150,TOP(1,'6–10','10–12')],
    ['Iso-Lateral Row','weight',120,'2 sets · 8–12 · chest-supported'],
    ['Incline Chest Press','weight',120,'2 sets · 8–12'],
    ['Lateral Raise Machine','weight',60,'3 sets · 12–20'],
    ['Overhead Triceps Extension','weight',90,'2 sets · 10–15'],
    ['Machine Biceps Curl','weight',90,'2 sets · 10–15 · or cable curl']]],
  ['Lower',[
    ['Hack Squat','weight',180,TOP(2,'6–10','10–12')],
    ['SLDL (Smith)','weight',150,TOP(1,'8–10','10–12')],
    ['Seated Hamstring Curl','weight',90,'3 sets · 8–12'],
    ['Leg Extensions','weight',90,'2 sets · 12–15'],
    ['Adductors','weight',60,'2 sets · 10–15'],
    ['Abductors','weight',60,'2 sets · 12–20'],
    ['Calf Raise','weight',90,'3 sets · 10–15 · pause in the stretch'],
    ['Cable Crunch','weight',60,'2 sets · 10–15']]]];
const defaultExercises=name=>{ const t=DEFAULT_PROGRAM.find(([n])=>n.toLowerCase()===String(name).toLowerCase()); return t? t[1].map(([n,kind,rest,desc])=>({id:uid(), name:n, desc, kind, rest, archived:false})) : null; };
/* The week, Monday first: a plan name per day, null for rest. */
const DEFAULT_WEEK=['Push','Pull','Legs',null,'Upper','Lower',null];
const weekFor=plans=>DEFAULT_WEEK.map(n=>{ const p=n&&plans.find(q=>q.name===n); return p? p.id : null; });
function defaultDb(){
  const plans=DEFAULT_PROGRAM.map(([n],i)=>({id:uid(),name:n,color:PALETTE[i],archived:false,exercises:defaultExercises(n)}));
  return {version:SCHEMA, settings:defaultSettings(), plans, schedule:weekFor(plans), log:{}};
}
/* Adds the default program to existing data: same-named plans get any missing exercises appended (yours are left as they are), missing plans are created. */
function addDefaultProgram(only){
  let addedEx=0, addedPlans=0;
  DEFAULT_PROGRAM.forEach(([name],i)=>{
    if(only&&only!==name) return;
    let p=db.plans.find(q=>q.name.toLowerCase()===name.toLowerCase());
    if(!p){ p={id:uid(), name, color:PALETTE[(db.plans.length+i)%PALETTE.length], archived:false, exercises:[]}; db.plans.push(p); addedPlans++; }
    p.archived=false;
    defaultExercises(name).forEach(ex=>{
      const have=p.exercises.find(x=>x.name.toLowerCase()===ex.name.toLowerCase());
      if(!have){ p.exercises.push(ex); addedEx++; } else if(have.archived){ have.archived=false; addedEx++; }
    });
    p.exercises=p.exercises.filter(x=>!x.archived).concat(p.exercises.filter(x=>x.archived));
  });
  if(!only&&!db.schedule.some(Boolean)) db.schedule=weekFor(db.plans);   // only fill an empty week; never rearrange one you've set
  commit();
  return {addedEx, addedPlans};
}
const blankSet=()=>({w:null,r:null,warm:false,done:false});
const cleanSet=s=>{ s=s||{}; return {w:num(s.w), r:num(s.r), warm:!!s.warm, done:!!s.done}; };
const isBlank=s=>s.w==null&&s.r==null;
const isReal=s=>s.r>0;
const isWork=s=>isReal(s)&&!s.warm;
const hasData=e=>!!(e&&e.ex&&Object.keys(e.ex).some(k=>e.ex[k].some(isReal)));

function cleanSettings(s){
  const d=defaultSettings(); s=s&&typeof s==='object'? s : {};
  const n=(v,lo,hi,def)=>{ v=num(v); return v!=null&&v>=lo&&v<=hi? v : def; };
  if(s.unit==='lb') d.unit='lb';
  if(typeof s.backoff==='boolean') d.backoff=s.backoff;
  d.backoffPct=n(s.backoffPct,30,100,80); d.roundKg=n(s.roundKg,0.25,20,2.5); d.roundLb=n(s.roundLb,0.5,50,5);
  d.restSec=Math.round(n(s.restSec,10,900,120));
  if(typeof s.restAuto==='boolean') d.restAuto=s.restAuto;
  if(s.theme==='light'||s.theme==='dark') d.theme=s.theme;
  if(typeof s.upNext==='boolean') d.upNext=s.upNext;
  if(isDateStr(s.backupAt)) d.backupAt=s.backupAt;
  d.backupCount=Math.round(n(s.backupCount,0,1e6,0));
  return d;
}

/* Rebuilds the database from known fields only, so a damaged or hand-edited file can't inject markup or break the app. */
function sanitize(d){
  if(!d||typeof d!=='object'||Array.isArray(d)) throw new Error('This is not a Gym Tracker file.');
  if(!d.version){ if(d.plans&&typeof d.plans==='object'&&!Array.isArray(d.plans)) return sanitize(migrateV1(d)); throw new Error('This is not a Gym Tracker file.'); }
  if(d.version>SCHEMA) throw new Error('This backup was made by a newer version of Gym Tracker.');
  if(!Array.isArray(d.plans)) throw new Error('This is not a Gym Tracker file.');
  const out={version:SCHEMA, settings:cleanSettings(d.settings), plans:[], schedule:[], log:{}};
  const exOf=new Map(), seen=new Set();
  d.plans.forEach((p,i)=>{
    if(!p||!isId(p.id)||seen.has(p.id)) return; seen.add(p.id);
    const plan={id:p.id, name:clampStr(p.name,60).trim()||'Plan', color:validColor(p.color)||PALETTE[i%PALETTE.length], archived:!!p.archived, exercises:[]};
    const ids=new Set(); exOf.set(p.id,ids);
    (Array.isArray(p.exercises)? p.exercises : []).forEach(e=>{
      if(!e||!isId(e.id)||seen.has(e.id)) return; seen.add(e.id); ids.add(e.id);
      plan.exercises.push({id:e.id, name:clampStr(e.name,80).trim()||'Exercise', desc:clampStr(e.desc,1000), kind:okKind(e.kind)? e.kind : 'weight', rest:cleanRest(e.rest), archived:!!e.archived});
    });
    out.plans.push(plan);
  });
  const sch=Array.isArray(d.schedule)? d.schedule : [];
  out.schedule=[0,1,2,3,4,5,6].map(i=>exOf.has(sch[i])? sch[i] : null);
  const log=d.log&&typeof d.log==='object'? d.log : {};
  Object.keys(log).forEach(date=>{
    const day=log[date]; if(!isDateStr(date)||!day||typeof day!=='object') return;
    Object.keys(day).forEach(pid=>{
      const ids=exOf.get(pid); const src=day[pid]; if(!ids||!src||typeof src!=='object') return;
      const e={ex:{}}; const exs=src.ex&&typeof src.ex==='object'? src.ex : {};
      Object.keys(exs).forEach(eid=>{
        if(!ids.has(eid)||!Array.isArray(exs[eid])) return;
        const sets=exs[eid].slice(0,100).map(cleanSet).filter(s=>!isBlank(s));
        if(sets.length) e.ex[eid]=sets;
      });
      if(Array.isArray(src.order)){ const o=[...new Set(src.order.filter(id=>ids.has(id)))]; if(o.length) e.order=o; }
      const note=clampStr(src.note,4000); if(note.trim()) e.note=note;
      if(Object.keys(e.ex).length||e.order||e.note) (out.log[date]=out.log[date]||{})[pid]=e;
    });
  });
  return out;
}

/* v1 kept everything keyed by name; give each plan and exercise a stable id. */
function migrateV1(d){
  const out={version:SCHEMA, settings:defaultSettings(), plans:[], log:{}};
  const pids={}, eids={};
  Object.keys(d.plans||{}).forEach((pname,i)=>{
    const plan={id:uid(), name:String(pname).slice(0,60), color:validColor(d.colors&&d.colors[pname])||PALETTE[i%PALETTE.length], archived:false, exercises:[]};
    const m=new Map(); eids[pname]=m;
    (Array.isArray(d.plans[pname])? d.plans[pname] : []).forEach(e=>{
      const name=typeof e==='string'? e : (e&&e.name); if(!name||m.has(name)) return;
      const ex={id:uid(), name:String(name).slice(0,80), desc:e&&typeof e==='object'&&e.desc? String(e.desc) : '', kind:'weight', archived:false};
      m.set(name,ex.id); plan.exercises.push(ex);
    });
    pids[pname]=plan.id; out.plans.push(plan);
  });
  Object.keys(d.log||{}).forEach(date=>{
    if(!isDateStr(date)) return; const day=d.log[date]||{};
    Object.keys(day).forEach(pname=>{
      const pid=pids[pname]; const m=eids[pname]; if(!pid) return;
      const e={ex:{}};
      Object.keys(day[pname]||{}).forEach(exName=>{
        const eid=m.get(exName); if(!eid) return;
        const sets=(Array.isArray(day[pname][exName])? day[pname][exName] : []).map(cleanSet).filter(s=>!isBlank(s));
        if(sets.length) e.ex[eid]=sets;
      });
      const ord=d.order&&d.order[pname]&&d.order[pname][date];
      if(Array.isArray(ord)){ const o=ord.map(n=>m.get(n)).filter(Boolean); if(o.length) e.order=o; }
      if(Object.keys(e.ex).length||e.order) (out.log[date]=out.log[date]||{})[pid]=e;
    });
  });
  const dates=Object.keys(out.log).sort();
  out.plans.forEach(p=>{
    // v1 used the order of a plan's first session as the template for new dates; make that the default order
    const first=dates.find(dt=>hasData(out.log[dt][p.id]));
    const ord=first&&out.log[first][p.id].order;
    if(ord){ const pos=id=>{ const i=ord.indexOf(id); return i<0? 1e6 : i; }; p.exercises.sort((a,b)=>pos(a.id)-pos(b.id)); }
    // drop per-date orders that now match the default, so they don't show as "changed for this date"
    const def=p.exercises.map(x=>x.id);
    dates.forEach(dt=>{ const e=out.log[dt][p.id]; if(e&&e.order&&sameArr(e.order.concat(def.filter(id=>!e.order.includes(id))),def)) delete e.order; });
    // an exercise that has reps logged but never a weight was a bodyweight exercise
    p.exercises.forEach(ex=>{
      let reps=false, weight=false;
      dates.forEach(dt=>{ const e=out.log[dt][p.id]; (e&&e.ex[ex.id]||[]).forEach(s=>{ if(s.r>0) reps=true; if(s.w>0) weight=true; }); });
      if(reps&&!weight) ex.kind='body';
    });
  });
  return out;
}

/* ---------- storage ---------- */
let bootNote=null, saveT=null, _dates=null, _datesFor=null;
function load(){
  let raw=null;

    try{ return sanitize(JSON.parse(raw)); }
    catch(e){ try{ localStorage.setItem(BAD_STORE,raw); }catch(_){} bootNote='unreadable'; return defaultDb(); }
  }
  let old=null; try{ old=localStorage.getItem(OLD_STORE); }catch(e){}
  if(old){ try{ const d=sanitize(migrateV1(JSON.parse(old))); bootNote='migrated'; return d; }catch(e){} }
  return defaultDb();
}

/* ---------- lookups ---------- */
/* sorted dates, cached until the log changes or the whole database is replaced */
const allDates=()=>_dates&&_datesFor===db? _dates : (_datesFor=db, _dates=Object.keys(db.log).sort());
const planById=id=>db.plans.find(p=>p.id===id)||null;
function entry(date,pid,create){
  let day=db.log[date]; if(!day){ if(!create) return null; day=db.log[date]={}; _dates=null; }
  let e=day[pid]; if(!e){ if(!create) return null; e=day[pid]={ex:{}}; }
  return e;
}
function dayPlans(date){ const day=db.log[date]; return day? db.plans.filter(p=>hasData(day[p.id])).map(p=>p.id) : []; }
function sessionCount(d=db){ let n=0; Object.keys(d.log).forEach(dt=>Object.keys(d.log[dt]).forEach(pid=>{ if(hasData(d.log[dt][pid])) n++; })); return n; }
function exHasHistory(pid,eid){ return allDates().some(d=>{ const e=db.log[d][pid]; return e&&e.ex[eid]&&e.ex[eid].some(s=>!isBlank(s)); }); }
const planHasHistory=pid=>allDates().some(d=>hasData(db.log[d][pid]));
const tabPlans=()=>{ const dp=dayPlans(curDate); return db.plans.filter(p=>!p.archived||dp.includes(p.id)); };
function fixCurPlan(){ const tp=tabPlans(); if(!tp.some(p=>p.id===curPlan)) curPlan=tp.length? tp[0].id : null; }

/* ---------- stats ---------- */
const epley=(w,r)=>w>0&&r>0? (r===1? w : w*(1+r/30)) : 0;
const setScore=(ex,s)=>ex.kind==='weight'? epley(s.w||0,s.r) : s.r;
function sessionStats(ex,sets){
  const w=sets.filter(isWork); if(!w.length) return null;
  if(ex.kind==='weight'){ let top=0,vol=0,e1=0; w.forEach(s=>{ const kg=s.w||0; top=Math.max(top,kg); vol+=kg*s.r; e1=Math.max(e1,epley(kg,s.r)); }); return {e1rm:e1, top, vol}; }
  let best=0,tot=0; w.forEach(s=>{ best=Math.max(best,s.r); tot+=s.r; }); return {e1rm:best, top:best, vol:tot};
}
function metricInfo(ex,m){
  if(ex.kind==='weight') return {weight:true, unit:U(), label:{e1rm:'Estimated 1-rep max',top:'Top set',vol:'Volume (weight × reps)'}[m]};
  const t=ex.kind==='time';
  return {weight:false, unit:t?'s':'reps', label:m==='vol'? (t?'Total time':'Total reps') : (t?'Longest set':'Best set')};
}
function exHistory(pid,ex){
  const out=[];
  allDates().forEach(d=>{ const e=db.log[d][pid]; const st=e&&e.ex[ex.id]&&sessionStats(ex,e.ex[ex.id]); if(st) out.push(Object.assign({date:d},st)); });
  return out;
}
function lastSession(pid,eid,before){
  const ds=allDates();
  for(let i=ds.length-1;i>=0;i--){ const d=ds[i]; if(d>=before) continue; const e=db.log[d][pid]; const s=e&&e.ex[eid]; if(s&&s.some(isReal)) return {date:d,sets:s}; }
  return null;
}
function priorBest(pid,ex,before){
  let b=0;
  for(const d of allDates()){ if(d>=before) break; const e=db.log[d][pid]; const s=e&&e.ex[ex.id]; if(s) s.forEach(x=>{ if(isWork(x)) b=Math.max(b,setScore(ex,x)); }); }
  return b;
}
function setsText(ex,sets){
  const parts=[];
  sets.filter(isWork).forEach(s=>{
    const w=s.w>0? (ex.kind==='weight'? '' : '+')+fmtW(s.w)+'×' : (ex.kind==='weight'? '–×' : '');
    const t=w+fmtNum(s.r)+(ex.kind==='time'?'s':'');
    const last=parts[parts.length-1];
    if(last&&last.t===t) last.n++; else parts.push({t,n:1});
  });
  return parts.map(p=>p.t+(p.n>1?' ×'+p.n:'')).join(' · ');
}

/* ---------- exercise order ----------
   Each plan has a default order (its exercise list). Moving exercises on a date stores an order for that date only. */
function dayList(plan,date){
  const e=entry(date,plan.id); const map=new Map(plan.exercises.map(x=>[x.id,x]));
  const visible=x=>!x.archived||!!(e&&e.ex[x.id]&&e.ex[x.id].some(s=>!isBlank(s)));
  let ids=e&&e.order? e.order.slice() : plan.exercises.filter(x=>!x.archived).map(x=>x.id);
  ids=ids.filter(id=>map.has(id)&&visible(map.get(id)));
  plan.exercises.forEach(x=>{ if(visible(x)&&!ids.includes(x.id)) ids.push(x.id); });
  return ids.map(id=>map.get(id));
}
function moveExercise(plan,i,dir){
  const list=dayList(plan,curDate).map(x=>x.id); const j=i+dir; if(j<0||j>=list.length) return;
  [list[i],list[j]]=[list[j],list[i]];
  const e=entry(curDate,plan.id,true); delete e.order;
  if(!sameArr(list, dayList(plan,curDate).map(x=>x.id))) e.order=list;
  commit(); renderLog();
}
function makeDefaultOrder(plan){
  const e=entry(curDate,plan.id); if(!e||!e.order) return;
  const pos=id=>{ const i=e.order.indexOf(id); return i<0? 1e6 : i; };
  plan.exercises.sort((a,b)=>pos(a.id)-pos(b.id)); delete e.order;
  commit(); renderLog(); toast('Default order updated');
}

/* ---------- state ---------- */
let db=load();
let curPlan=null, curDate=todayStr(), lastToday=curDate, view='log', metric='e1rm', range='all', calCursor=null;
fixCurPlan();

/* Top set then back-offs: the 2nd working set suggests the back-off % of the top set; later sets copy the one before. */
function nextSet(ex,sets){
  const st=db.settings; const work=sets.filter(s=>!s.warm); const prev=sets[sets.length-1];
  if(ex.kind==='weight'&&st.backoff&&work.length===1&&work[0].w>0){
    const inc=U()==='lb'? st.roundLb : st.roundKg;
    const disp=Math.round(toDisp(work[0].w)*st.backoffPct/100/inc)*inc;
    return {set:{w:fromDisp(disp),r:null,warm:false,done:false}, msg:'Back-off set · '+fmtNum(disp)+' '+U()+' ('+fmtNum(st.backoffPct,1)+'% of '+fmtW(work[0].w)+')'};
  }
  if(prev&&!isBlank(prev)) return {set:{w:prev.w,r:prev.r,warm:prev.warm,done:false}, msg:'Set added · same as previous'};
  return {set:blankSet(), msg:'Set added'};
}

/* Exercises with history are archived (kept for Progress and past dates); empty ones are deleted. Callers wrap this in undoable(). */
function removeExercise(plan,ex){
  if(!exHasHistory(plan.id,ex.id)){
    plan.exercises=plan.exercises.filter(x=>x!==ex);
    Object.keys(db.log).forEach(d=>{ const e=db.log[d][plan.id]; if(e){ delete e.ex[ex.id]; if(e.order) e.order=e.order.filter(id=>id!==ex.id); } });
  } else ex.archived=true;
  commit();
}

/* One exercise per line; leading bullets or numbers ("- ", "1. ") are ignored so a pasted list works. */
const parseList=text=>text.split(/\r?\n/).map(l=>l.replace(/^\s*(?:[-*•·]|\d+[.)])\s*/,'').trim().slice(0,80)).filter(Boolean);
function quickAdd(plan,text){
  let added=0, restored=0, skipped=0;
  parseList(text).forEach(name=>{
    const ex=plan.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!ex){ plan.exercises.push({id:uid(), name, desc:'', kind:'weight', archived:false}); added++; }
    else if(ex.archived){ ex.archived=false; plan.exercises=plan.exercises.filter(x=>x!==ex).concat(ex); restored++; }
    else skipped++;
  });
  plan.exercises=plan.exercises.filter(x=>!x.archived).concat(plan.exercises.filter(x=>x.archived));
  commit(); renderPlans();
  toast([added&&'Added '+added, restored&&'restored '+restored, skipped&&skipped+' already in plan'].filter(Boolean).join(' · ')||'Nothing to add');
}
/* ---------- rest timer ---------- */
const rest={end:0, timer:null, hideT:null, ctx:null};
const mmss=s=>Math.floor(s/60)+':'+pad(s%60);
function startRest(sec,label){
  sec=sec||db.settings.restSec; rest.end=Date.now()+sec*1000; rest.total=sec*1000; ensureAudio();
  document.querySelector('#rest .rl').textContent=label||'Rest';
  clearTimeout(rest.hideT); clearInterval(rest.timer);
  $('rest').classList.add('show'); $('rest').classList.remove('over'); document.body.classList.add('resting');
  rest.timer=setInterval(tickRest,250); tickRest();
}
function tickRest(){
  if(!rest.timer) return;
  const left=Math.ceil((rest.end-Date.now())/1000);
  if(left<=0){
    clearInterval(rest.timer); rest.timer=null;
    $('restTime').textContent='Rest over'; $('rest').classList.add('over'); $('restBar').style.transform='scaleX(1)'; beep(); haptic();
    try{ if(navigator.vibrate) navigator.vibrate([250,120,250]); }catch(e){}
    rest.hideT=setTimeout(stopRest,6000); return;
  }
  $('restTime').textContent=mmss(left);
  $('restBar').style.transform='scaleX('+Math.min(1,(rest.end-Date.now())/rest.total)+')';
}
function addRest(n){ if(!rest.timer){ startRest(Math.max(15,n)); return; } rest.end=Math.max(Date.now()+1000, rest.end+n*1000); rest.total=Math.max(rest.total, rest.end-Date.now()); tickRest(); }
function stopRest(){ clearInterval(rest.timer); rest.timer=null; clearTimeout(rest.hideT); $('rest').classList.remove('show','over'); document.body.classList.remove('resting'); }
function ensureAudio(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!rest.ctx&&AC) rest.ctx=new AC(); if(rest.ctx&&rest.ctx.state==='suspended') rest.ctx.resume(); }catch(e){} }
function beep(){
  const ctx=rest.ctx; if(!ctx) return;
  try{ [0,0.28,0.56].forEach(t=>{ const o=ctx.createOscillator(), g=ctx.createGain(), t0=ctx.currentTime+t;
    o.frequency.value=880; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.3,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
    o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+0.22); }); }catch(e){}
}
$('restMinus').onclick=()=>addRest(-15);
$('restPlus').onclick=()=>addRest(15);

/* ---------- PROGRESS ---------- */
function niceTicks(lo,hi){
  if(hi-lo<1e-9){ hi=lo+1; lo=Math.max(0,lo-1); }
  const raw=(hi-lo)/3, mag=10**Math.floor(Math.log10(raw)), f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, t=[];
  for(let v=a; v<=b+step/2; v+=step) t.push(+v.toFixed(6));
  return t;
}
const fmtAxis=v=>v>=10000? Math.round(v/1000)+'k' : v>=1000? fmtNum(v/1000,1)+'k' : fmtNum(v,1);
const tip=$('tip');
function showTip(svg,W,vx,vy,html){
  const r=svg.getBoundingClientRect(), k=r.width/W;
  tip.innerHTML=html; tip.hidden=false;
  const x=Math.min(Math.max(r.left+vx*k, 70), window.innerWidth-70);
  tip.style.left=x+'px'; tip.style.top=(r.top+vy*k-10)+'px';
}
const hideTip=()=>{ tip.hidden=true; };

/* points: [{x:dayNum, v:display value, date, pr}] */
function lineChartEl(points,col,info){
  const W=320,H=160,L=38,R=12,T=12,B=24;
  const ticks=niceTicks(Math.min(...points.map(p=>p.v)),Math.max(...points.map(p=>p.v)));
  const lo=ticks[0], hi=ticks[ticks.length-1];
  const x0=points[0].x, x1=points[points.length-1].x, span=x1-x0;
  const X=x=>span? L+(x-x0)/span*(W-L-R) : L+(W-L-R)/2;
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';
  ticks.forEach(t=>{ const y=Y(t); g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" class="g-grid"/><text x="'+(L-6)+'" y="'+(y+3)+'" class="g-txt" font-size="10" text-anchor="end">'+fmtAxis(t)+'</text>'; });
  const lbl=span>300? monYY : ddmm;
  const xl=[[points[0],'start']]; if(points.length>1) xl.push([points[points.length-1],'end']);
  if(points.length>2&&span>20){ const mid=points.reduce((a,p)=>Math.abs(p.x-(x0+span/2))<Math.abs(a.x-(x0+span/2))? p : a); if(X(mid.x)-L>50&&W-R-X(mid.x)>50) xl.push([mid,'middle']); }
  xl.forEach(([p,a])=>{ g+='<text x="'+X(p.x)+'" y="'+(H-6)+'" class="g-txt" font-size="10" text-anchor="'+(points.length===1?'middle':a)+'">'+esc(lbl(p.date))+'</text>'; });
  if(points.length>1) g+='<polyline points="'+points.map(p=>X(p.x)+','+Y(p.v)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  points.forEach(p=>{
    if(p.pr) g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.v)+'" r="7" fill="none" class="g-pr"/>';
    g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.v)+'" r="4" fill="'+col+'" class="g-ring"/>';
  });
  g+='<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" class="g-xh" visibility="hidden"/>';
  g+='<circle class="hl" r="6" fill="'+col+'" class="g-hl" visibility="hidden"/>';
  g+='<rect x="'+(L-8)+'" y="0" width="'+(W-L-R+16)+'" height="'+H+'" fill="transparent"/>';
  const wrap=document.createElement('div');
  wrap.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(info.label)+' over time, '+points.length+' sessions">'+g+'</svg>';
  const svg=wrap.firstChild, xh=svg.querySelector('.xh'), hl=svg.querySelector('.hl');
  const move=ev=>{
    const r=svg.getBoundingClientRect(), vx=(ev.clientX-r.left)/r.width*W;
    let best=points[0]; points.forEach(p=>{ if(Math.abs(X(p.x)-vx)<Math.abs(X(best.x)-vx)) best=p; });
    const px=X(best.x), py=Y(best.v);
    xh.setAttribute('x1',px); xh.setAttribute('x2',px); xh.setAttribute('visibility','visible');
    hl.setAttribute('cx',px); hl.setAttribute('cy',py); hl.setAttribute('visibility','visible');
    showTip(svg,W,px,py,esc(fmtBig(best.v)+' '+info.unit)+(best.pr?' · 🏆 best':'')+'<small>'+esc(shortDate(best.date))+'</small>');
  };
  const leave=()=>{ xh.setAttribute('visibility','hidden'); hl.setAttribute('visibility','hidden'); hideTip(); };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',leave); svg.addEventListener('pointercancel',leave);
  return svg;
}
/* weeks: [{start, v}] */
function barChartEl(weeks,col,unit){
  const W=320,H=130,L=38,R=12,T=10,B=22, n=weeks.length;
  const ticks=niceTicks(0,Math.max(...weeks.map(w=>w.v))), hi=ticks[ticks.length-1];
  const slot=(W-L-R)/n, bw=Math.min(24,slot-2);
  const Y=v=>T+(1-v/hi)*(H-T-B), base=Y(0);
  let g='';
  ticks.forEach(t=>{ const y=Y(t); g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" class="g-grid"/><text x="'+(L-6)+'" y="'+(y+3)+'" class="g-txt" font-size="10" text-anchor="end">'+fmtAxis(t)+'</text>'; });
  weeks.forEach((w,i)=>{
    const cx=L+slot*(i+.5), x=cx-bw/2;
    if(w.v>0){ const y=Y(w.v), h=base-y, r=Math.min(4,h,bw/2);
      g+='<path d="M'+x+','+base+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+bw-r)+'Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+'V'+base+'Z" fill="'+col+'"/>'; }
    if(i===0||i===n-1||i===Math.floor(n/2)) g+='<text x="'+cx+'" y="'+(H-6)+'" class="g-txt" font-size="10" text-anchor="middle">'+esc(ddmm(w.start))+'</text>';

/* Least-squares trend over the last few sessions, so one odd day doesn't swing the number. */
function trend(points){
  const p=points.slice(-8); if(p.length<2) return null;
  if(p.length===2) return {d:p[1].v-p[0].v, n:2};
  const mx=p.reduce((a,q)=>a+q.x,0)/p.length, my=p.reduce((a,q)=>a+q.v,0)/p.length;
  let sxy=0,sxx=0; p.forEach(q=>{ sxy+=(q.x-mx)*(q.v-my); sxx+=(q.x-mx)**2; });
  return {d:sxx? sxy/sxx*(p[p.length-1].x-p[0].x) : 0, n:p.length};
}

    let d; try{ d=sanitize(JSON.parse(rd.result)); }catch(e){ alert('Could not import this file.\n\n'+(e instanceof SyntaxError? 'It is not valid JSON.' : e.message)); return; }

/* ---------- up next ----------
   With a weekly order set (Plans → Week): the first workout in that order not yet done since Monday.
   A missed workout waits rather than being skipped. Sessions on any day count, so you can train on other days. */
const dayIdx=ds=>(parseYmd(ds).getDay()+6)%7;   // 0 = Monday
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function weekStatus(){
  const t=todayStr(), mon=mondayOf(t), left=new Map();
  allDates().forEach(d=>{ if(d>=mon&&d<=t) dayPlans(d).forEach(pid=>left.set(pid,(left.get(pid)||0)+1)); });
  const doneBefore=new Map(); allDates().forEach(d=>{ if(d>=mon&&d<t) dayPlans(d).forEach(pid=>doneBefore.set(pid,(doneBefore.get(pid)||0)+1)); });
  const slots=db.schedule.map((id,i)=>{ const p=id&&planById(id); return {i, p:p&&!p.archived? p : null}; });
  // done = matched to a session this week (today included); next = first slot not covered by sessions before today
  slots.forEach(s=>{ if(!s.p) return; const n=left.get(s.p.id)||0; s.done=n>0; if(n>0) left.set(s.p.id,n-1); });
  let next=null;
  for(const s of slots){ if(!s.p) continue; const n=doneBefore.get(s.p.id)||0; if(n>0){ doneBefore.set(s.p.id,n-1); continue; } next=s; break; }
  const planned=slots.filter(s=>s.p);
  return {slots, next, planned:planned.length, complete:!!planned.length&&!next};
}
function upNextPlan(){
  if(db.schedule.some(id=>{ const p=id&&planById(id); return p&&!p.archived; })){
    const w=weekStatus(); return w.next? w.next.p : null;
  }
  return learnedNext();
}
/* No weekly order: learn the rotation from the last 8 weeks (whatever followed the last plan the previous time),
   falling back to the plan trained longest ago. */
function learnedNext(){
  const t=todayStr(), from=shiftDay(t,-56), seq=[];
  const usable=p=>p&&!p.archived&&p.exercises.some(x=>!x.archived);
  allDates().forEach(d=>{ if(d>=from&&d<t) dayPlans(d).forEach(pid=>{ if(usable(planById(pid))) seq.push(pid); }); });
  if(!seq.length) return null;
  const last=seq[seq.length-1];
  for(let i=seq.length-2;i>=0;i--) if(seq[i]===last){ if(seq[i+1]!==last) return planById(seq[i+1]); break; }
  const lastSeen=new Map(); seq.forEach((pid,i)=>lastSeen.set(pid,i));
  const others=[...lastSeen.entries()].filter(([pid])=>pid!==last).sort((a,b)=>a[1]-b[1]);
  return others.length? planById(others[0][0]) : null;
}

      '<input type="text" inputmode="decimal" autocomplete="off" data-f="w" aria-label="Set '+(si+1)+' '+k.w.toLowerCase()+' in '+U()+'" placeholder="'+esc(wPh)+'" value="'+esc(fmtW(s.w))+'">'+
      '<input type="text" inputmode="numeric" autocomplete="off" data-f="r" aria-label="Set '+(si+1)+' '+k.r.toLowerCase()+'" placeholder="'+esc(rPh)+'" value="'+esc(fmtNum(s.r))+'">'+

    row.querySelector('.chk').onclick=()=>{

/* Trophy on today's best set when it beats every earlier session. */
function markPR(card,plan,ex,sets){
  const rows=card.querySelectorAll('.set'), pb=priorBest(plan.id,ex,curDate); let best=-1, score=pb;
  if(pb>0) sets.forEach((s,i)=>{ if(isWork(s)){ const v=setScore(ex,s); if(v>score+1e-9){ score=v; best=i; } } });
  rows.forEach((r,i)=>{ const b=r.querySelector('.prb'); if(b) b.hidden=i!==best; });
}

/* ---------- swipe left to delete ---------- */
function closeSwipes(except){
  document.querySelectorAll('.swipe.open').forEach(w=>{ if(w===except) return; const r=w.querySelector('.slide'); r.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)'; r.style.transform=''; w.classList.remove('open'); });
}
function attachSwipe(wrap,onDelete){
  const row=wrap.querySelector('.slide'), W=96;
  let x0=0, y0=0, base=0, dx=0, mode=null, pid=null;
  const place=(x,anim)=>{ row.style.transition=anim? 'transform .25s cubic-bezier(.2,.8,.2,1)' : 'none'; row.style.transform=x? 'translateX('+x+'px)' : ''; wrap.classList.toggle('open',x<0); };
  row.addEventListener('pointerdown',e=>{
    if(e.target.closest('.grip')||(e.pointerType==='mouse'&&e.button!==0)) return;
    closeSwipes(wrap); x0=e.clientX; y0=e.clientY; base=wrap.classList.contains('open')? -W : 0; dx=base; mode=null; pid=e.pointerId;
  });
  row.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid) return;
    const mx=e.clientX-x0, my=e.clientY-y0;
    if(!mode){
      if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.3){ mode='swipe'; try{ row.setPointerCapture(pid); }catch(_){} const a=document.activeElement; if(a&&row.contains(a)) a.blur(); }
      else if(Math.abs(my)>10) mode='scroll';
    }
    if(mode==='swipe'){ dx=Math.min(0,Math.max(-W*2.2,base+mx)); place(dx,false); e.preventDefault(); }
  });
  const end=e=>{
    if(e.pointerId!==pid) return; pid=null;
    if(mode==='swipe'){
      const swallow=ev=>{ ev.stopPropagation(); ev.preventDefault(); };
      row.addEventListener('click',swallow,{capture:true,once:true}); setTimeout(()=>row.removeEventListener('click',swallow,{capture:true}),350);
      if(dx<-W*1.8){ onDelete(); } else { place(dx<-W/2? -W : 0,true); if(dx<-W/2) haptic(); }
    }
    mode=null;
  };
  row.addEventListener('pointerup',end); row.addEventListener('pointercancel',end);
  wrap.querySelector('.swipe-del').onclick=onDelete;
}
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.swipe.open')) closeSwipes(); },true);

/* ---------- drag to reorder (Plans) ---------- */
function attachReorder(list,onDrop){
  list.querySelectorAll('.grip').forEach(g=>g.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const item=g.closest('.swipe'), items=[...list.querySelectorAll('.swipe')], from=items.indexOf(item), h=item.offsetHeight, y0=e.clientY;
    let to=from;
    try{ g.setPointerCapture(e.pointerId); }catch(_){}
    item.classList.add('dragging'); haptic();
    const move=ev=>{
      const dy=ev.clientY-y0; item.style.transform='translateY('+dy+'px)';
      const t=Math.max(0,Math.min(items.length-1,from+Math.round(dy/h)));
      if(t!==to){ to=t; haptic(); }
      items.forEach((it,i)=>{ if(it===item) return; const off=from<to&&i>from&&i<=to? -h : from>to&&i<from&&i>=to? h : 0; it.style.transform=off? 'translateY('+off+'px)' : ''; });
    };
    const up=()=>{
      g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up); g.removeEventListener('pointercancel',up);
      items.forEach(it=>{ it.style.transform=''; }); item.classList.remove('dragging');
      if(to!==from) onDrop(from,to);
    };
    g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
  }));
}

function closeSheet(d,then){

}

    const wrap=document.createElement('div'); wrap.className='swipe';
    wrap.innerHTML='<button class="swipe-del" tabindex="-1">Remove</button><div class="row slide"><span class="grip" role="button" aria-label="Drag to reorder '+esc(ex.name)+'">'+I('grip')+'</span>'+
      '<button class="row-main"><span class="lbl">'+esc(ex.name)+'</span><span class="rsub">'+esc(KINDS[ex.kind].label+(ex.rest? ' · Rest '+mmss(ex.rest) : '')+(ex.desc? ' · '+ex.desc.split('\n')[0] : ''))+'</span></button>'+I('chevR','chev')+'</div>';
    wrap.querySelector('.row-main').onclick=()=>openExSheet(plan,ex);
    attachSwipe(wrap,()=>undoable(ex.name+' removed',()=>{ removeExercise(plan,ex); renderPlans(); }));
    g.appendChild(wrap);
  });
  attachReorder(g,(from,to)=>{
    const a=plan.exercises.filter(x=>!x.archived), [m]=a.splice(from,1); a.splice(to,0,m);
    plan.exercises=a.concat(plan.exercises.filter(x=>x.archived)); commit(); renderPlans();
  });
  c.appendChild(g);
  if(act.length) c.insertAdjacentHTML('beforeend','<div class="group-f">Drag the lines to reorder, swipe left to remove, tap to edit. Every new '+esc(plan.name)+' session starts with this list.</div>');
  c.insertAdjacentHTML('beforeend','<div class="group-h">Add exercises</div>');
  const qa=document.createElement('div'); qa.className='group';
  qa.innerHTML='<textarea class="cell-input" id="qaIn" rows="4" placeholder="One per line, e.g.&#10;Bench press&#10;Incline dumbbell press&#10;Dips" aria-label="Exercises to add, one per line"></textarea>';
  qa.appendChild(btn('row btn tint',I('plus','sm')+'<span class="lbl">Add to '+esc(plan.name)+'</span>',()=>{ const ta=$('qaIn'); if(!parseList(ta.value).length){ ta.focus(); return; } haptic(); quickAdd(plan,ta.value); }));
  c.appendChild(qa);
  c.insertAdjacentHTML('beforeend','<div class="group-f">Paste a list from Notes if you like. Bullets and numbers are ignored.</div>');
  if(gone.length){
    c.insertAdjacentHTML('beforeend','<div class="group-h">Removed · history kept</div>');
    const rg=document.createElement('div'); rg.className='group';
    gone.forEach(ex=>{
      const r=document.createElement('div'); r.className='row'; r.innerHTML='<span class="lbl">'+esc(ex.name)+'</span>';
      r.appendChild(btn('pill soft','Restore',()=>{ ex.archived=false; plan.exercises=plan.exercises.filter(x=>!x.archived).concat(plan.exercises.filter(x=>x.archived)); commit(); haptic(); renderPlans(); toast('Restored'); }));
      rg.appendChild(r);
    });
    c.appendChild(rg);
  }
  c.insertAdjacentHTML('beforeend','<div class="group-h">Plan</div>');
  const ps=document.createElement('div'); ps.className='group';
  const cr=document.createElement('label'); cr.className='row'; cr.innerHTML='<span class="lbl">Colour</span><input type="color" class="cpick" aria-label="Plan colour">';
  const pick=cr.querySelector('input'); pick.value=plan.color;
  pick.oninput=()=>{ const v=validColor(pick.value); if(!v) return; plan.color=v; changed(); const dot=document.querySelector('.chip.on i'); if(dot) dot.style.background=v; };
  pick.onchange=()=>commit();
  ps.appendChild(cr);
  ps.appendChild(btn('row btn','<span class="lbl">Rename Plan</span>'+I('chevR','chev'),()=>formPrompt('Rename Plan','Plan name',plan.name,'Save',n=>{
    if(n===plan.name) return;
    if(db.plans.some(q=>q!==plan&&q.name.toLowerCase()===n.toLowerCase())){ toast('A plan with that name exists'); return false; }
    plan.name=n; commit(); render(); toast('Plan renamed');
  })));
  ps.appendChild(btn('row btn destructive','<span class="lbl">'+(planHasHistory(plan.id)? 'Archive Plan' : 'Delete Plan')+'</span>',()=>archivePlan(plan)));
  c.appendChild(ps);
  c.insertAdjacentHTML('beforeend','<div class="group-f">Archived plans keep their history in Progress and can be restored in Settings.</div>');
}

/* ---------- PROGRESS ---------- */
const fmtCompact=v=>v>=100000? Math.round(v/1000)+'k' : v>=10000? fmtNum(v/1000,1)+'k' : fmtBig(v);
function renderProgressView(){ setNav('Progress',[],[]); $('head').innerHTML='<div class="large"><h1>Progress</h1></div>'; renderProgress(); }
function renderProgress(){
  const c=$('content'); c.innerHTML='';
  const t=todayStr(), wk=mondayOf(t), m30=shiftDay(t,-30);
  let sess=0, vol=0, prs=0;
  allDates().forEach(d=>{ if(d<wk||d>t) return; Object.keys(db.log[d]).forEach(pid=>{ const e=db.log[d][pid], p=planById(pid); if(!p||!hasData(e)) return; sess++;
    p.exercises.forEach(ex=>{ if(ex.kind==='weight'&&e.ex[ex.id]){ const st=sessionStats(ex,e.ex[ex.id]); if(st) vol+=st.vol; } }); }); });
  db.plans.forEach(p=>p.exercises.forEach(ex=>{ let run=0; exHistory(p.id,ex).forEach((h,i)=>{ if(i>0&&h.e1rm>run+1e-9&&h.date>=m30) prs++; run=Math.max(run,h.e1rm); }); }));
  const tiles=document.createElement('div'); tiles.className='tiles';
  tiles.innerHTML=[['Sessions',String(sess),'this week'],['Volume',fmtCompact(toDisp(vol))+' '+U(),'this week'],['Records',String(prs),'last 30 days']]
    .map(([l,v,s])=>'<div class="tile"><span class="tl">'+l+'</span><b>'+esc(v)+'</b><span class="ts">'+s+'</span></div>').join('');
  c.appendChild(tiles);
  const ctl=document.createElement('div'); ctl.className='ctl';
  const seg=(opts,cur,fn)=>{ const s=document.createElement('div'); s.className='seg'; opts.forEach(([k,l])=>s.appendChild(btn(k===cur? 'on' : '',l,()=>{ if(k!==cur){ haptic(); fn(k); renderProgress(); } }))); return s; };
  ctl.appendChild(seg([['e1rm','Strength'],['top','Top Set'],['vol','Volume']],metric,k=>metric=k));
  ctl.appendChild(seg([['3m','3M'],['6m','6M'],['1y','1Y'],['all','All']],range,k=>range=k));
  c.appendChild(ctl);
  c.insertAdjacentHTML('beforeend','<div class="group-f">'+{e1rm:'Strength is your estimated one-rep max, from the best working set (Epley formula).', top:'Top set is the heaviest working set of the day.', vol:'Volume is weight × reps over working sets; warm-ups are left out.'}[metric]+
    ' Bodyweight and timed exercises show reps or seconds. Ringed points are personal bests.</div>');
  const cutoff=dayNum(t)-RANGES[range]; let any=false;
  db.plans.filter(p=>!p.archived).concat(db.plans.filter(p=>p.archived)).forEach(plan=>{
    const charts=[];
    plan.exercises.forEach(ex=>{
      const hist=exHistory(plan.id,ex); if(!hist.length) return;
      const info=metricInfo(ex,metric); let run=0;
      const all=hist.map((h,i)=>{ const v=info.weight? toDisp(h[metric]) : h[metric]; const pr=i>0&&v>run+1e-9; run=Math.max(run,v); return {x:dayNum(h.date), v, date:h.date, pr}; });
      const pts=all.filter(p=>p.x>=cutoff); if(pts.length) charts.push({ex,info,pts,best:run});
    });
    if(!charts.length) return;
    any=true;
    c.insertAdjacentHTML('beforeend','<div class="group-h"><i style="background:'+plan.color+'"></i>'+esc(plan.name)+(plan.archived? ' · archived' : '')+'</div>');
    const weeks=[]; let m=mondayOf(t);
    for(let i=0;i<12;i++){ weeks.unshift({start:m,v:0}); m=shiftDay(m,-7); }
    const wIdx=new Map(weeks.map((w,i)=>[w.start,i]));
    allDates().forEach(d=>{ const i=wIdx.get(mondayOf(d)), e=db.log[d][plan.id]; if(i==null||!e) return;
      plan.exercises.forEach(ex=>{ if(ex.kind!=='weight'||!e.ex[ex.id]) return; const st=sessionStats(ex,e.ex[ex.id]); if(st) weeks[i].v+=toDisp(st.vol); }); });
    if(weeks.some(w=>w.v>0)){
      const card=document.createElement('div'); card.className='chart';
      const avg=weeks.slice(-4).reduce((a,w)=>a+w.v,0)/4;
      card.innerHTML='<div class="ch-t"><h3>Weekly Volume</h3></div><div class="ch-s">Last 12 weeks · 4-week average '+esc(fmtCompact(avg))+' '+U()+'</div>';
      card.appendChild(barChartEl(weeks,plan.color,U()));
      tableToggle(card,weeks.map(w=>[ddmm(w.start),fmtBig(w.v)]),['Week of','Volume ('+U()+')']);
      c.appendChild(card);
    }
    charts.forEach(({ex,info,pts,best})=>{
      const last=pts[pts.length-1], tr=trend(pts);
      let delta='';
      if(tr){ const up=tr.d>1e-9, dn=tr.d<-1e-9;
        delta='<span class="delta" style="color:'+(up? 'var(--green)' : dn? 'var(--red)' : 'var(--label2)')+'" title="Trend over the last '+tr.n+' sessions">'+(up? '▲ +' : dn? '▼ ' : '')+esc(fmtBig(tr.d)+' '+info.unit)+'</span>'; }
      const card=document.createElement('div'); card.className='chart';
      card.innerHTML='<div class="ch-t"><h3>'+esc(ex.name)+'</h3>'+delta+'</div>'+
        '<div class="ch-s">'+esc(info.label)+' · latest '+esc(fmtBig(last.v)+' '+info.unit)+' · best '+esc(fmtBig(best)+' '+info.unit)+' · '+pts.length+' session'+(pts.length>1? 's' : '')+(ex.archived? ' · archived' : '')+'</div>';
      card.appendChild(lineChartEl(pts,plan.color,info));
      tableToggle(card,pts.map(p=>[ddmm(p.date),fmtBig(p.v)+(p.pr? ' 🏆' : '')]),['Date',info.label+' ('+info.unit+')']);
      c.appendChild(card);
    });
  });
  if(!any) c.appendChild(emptyState('progress',range==='all'? 'No Data Yet' : 'Nothing in This Period','Log a few workouts and your progress charts appear here.',null));
}

/* ---------- SETTINGS ---------- */
function renderSettingsView(){ setNav('Settings',[],[]); $('head').innerHTML='<div class="large"><h1>Settings</h1></div>'; renderSettings(); }
function renderSettings(){
  const c=$('content'), st=db.settings, prev=readPrev(); c.innerHTML='';
  const sec=(title,foot)=>{ if(title) c.insertAdjacentHTML('beforeend','<div class="group-h">'+title+'</div>'); const g=document.createElement('div'); g.className='group'; c.appendChild(g); if(foot) c.insertAdjacentHTML('beforeend','<div class="group-f">'+foot+'</div>'); return g; };
  const segRow=(g,opts,cur,fn)=>{ const r=document.createElement('div'); r.className='row'; const s=document.createElement('div'); s.className='seg';
    opts.forEach(([k,l])=>s.appendChild(btn(k===cur? 'on' : '',l,()=>{ if(k===cur) return; haptic(); fn(k); commit(); renderSettings(); }))); r.appendChild(s); g.appendChild(r); };
  const switchRow=(g,label,val,fn)=>{ const r=document.createElement('label'); r.className='row'; r.innerHTML='<span class="lbl">'+label+'</span><input type="checkbox" class="switch">';
    const i=r.querySelector('input'); i.checked=val; i.onchange=()=>{ haptic(); fn(i.checked); commit(); }; g.appendChild(r); };
  const numRow=(g,label,val,unit,mode,fn)=>{ const r=document.createElement('label'); r.className='row'; r.innerHTML='<span class="lbl">'+label+'</span><input type="text" class="num-in" inputmode="'+mode+'" autocomplete="off"><span class="unit">'+unit+'</span>';
    const i=r.querySelector('input'); i.value=val; i.onchange=()=>{ i.value=fn(num(i.value)); commit(); }; g.appendChild(r); };
  segRow(sec('Appearance'),[['system','Automatic'],['light','Light'],['dark','Dark']],st.theme,k=>{ st.theme=k; applyTheme(); });
  segRow(sec('Units'),[['kg','Kilograms'],['lb','Pounds']],st.unit,k=>{ st.unit=k; });
  const bo=sec('Back-off sets','After your top set, Add Set suggests the next one at this percentage of it. Later sets copy the back-off set.');
  switchRow(bo,'Suggest Back-off Set',st.backoff,v=>{ st.backoff=v; });
  numRow(bo,'Percentage of Top Set',fmtNum(st.backoffPct,1),'%','decimal',v=>{ if(v!=null&&v>=30&&v<=100) st.backoffPct=v; return fmtNum(st.backoffPct,1); });
  const incKey=U()==='lb'? 'roundLb' : 'roundKg';
  numRow(bo,'Round To',fmtNum(st[incKey]),U(),'decimal',v=>{ if(v!=null&&v>=0.25&&v<=50) st[incKey]=v; return fmtNum(st[incKey]); });
  const rt=sec('Rest timer');
  const rr=document.createElement('div'); rr.className='row'; rr.innerHTML='<span class="lbl">Duration</span><span class="val">'+mmss(st.restSec)+'</span>';
  const stp=document.createElement('div'); stp.className='stepper';
  [['−',-15,'Shorter'],['+',15,'Longer']].forEach(([s,d,l])=>stp.appendChild(btn('',s,()=>{ st.restSec=Math.max(15,Math.min(900,st.restSec+d)); rr.querySelector('.val').textContent=mmss(st.restSec); haptic(); commit(); },l)));
  rr.appendChild(stp); rt.appendChild(rr);
  switchRow(rt,'Start When a Set Is Ticked',st.restAuto,v=>{ st.restAuto=v; });
  c.insertAdjacentHTML('beforeend','<div class="group-f">This is the default. Give an exercise its own rest time by editing it in Plans.</div>');
  const wo=sec('Workout','Opens today on the next workout in your weekly order (Plans → Week). With no order set, it learns your rotation from recent sessions.');
  switchRow(wo,'Open on the Plan That’s Up Next',st.upNext,v=>{ st.upNext=v; });
  const pg=sec('Program','Fills Push, Pull, Legs, Upper and Lower with the default machine-based program, with targets and rest times. Exercises you already have, and all your history, are left as they are.');
  pg.appendChild(btn('row btn tint',I('plans','sm')+'<span class="lbl">Add Default Program</span>',()=>{
    haptic();
    let r; undoable('Default program added',()=>{ r=addDefaultProgram(); renderSettings(); });
    if(r&&!r.addedEx&&!r.addedPlans){ hideSnack(); toast('You already have every default exercise'); }
  }));
  const store=persistState==='yes'? ' The browser has agreed not to clear it automatically.' : persistState==='no'? ' The browser may clear it if the phone runs low on space.' : '';
  const bk=sec('Backup','Your log is stored only in this browser on this phone. Last backup: <b>'+(st.backupAt? esc(fullDate(st.backupAt)) : 'never')+'</b>.'+store);
  bk.appendChild(btn('row btn tint',I('backup','sm')+'<span class="lbl">Export Backup</span>',exportBackup));
  bk.appendChild(btn('row btn tint',I('upload','sm')+'<span class="lbl">Import Backup…</span>',()=>$('importFile').click()));
  if(prev) bk.appendChild(btn('row btn tint',I('undo','sm')+'<span class="lbl">Restore Data From Before Last Import or Reset</span>',restorePrev));
  const arch=[]; db.plans.forEach(p=>{ if(p.archived) arch.push({p}); else p.exercises.forEach(ex=>{ if(ex.archived) arch.push({p,ex}); }); });
  if(arch.length){
    const ag=sec('Archived','Archived items keep their history. Delete removes them and their logged sets for good.');
    arch.forEach(a=>{
      const r=document.createElement('div'); r.className='row';
      r.innerHTML='<span class="lbl">'+(a.ex? esc(a.ex.name)+' <span class="muted">· '+esc(a.p.name)+'</span>' : esc(a.p.name)+' <span class="muted">· plan</span>')+'</span>';
      r.appendChild(btn('pill soft','Restore',()=>{ if(a.ex) a.ex.archived=false; else a.p.archived=false; commit(); haptic(); renderSettings(); toast('Restored'); }));
      r.appendChild(btn('pill danger','Delete',()=>{
        const what=a.ex? '"'+a.ex.name+'" and all of its logged sets' : 'the plan "'+a.p.name+'" and all of its logged sessions';
        if(!confirm('Permanently delete '+what+'?\n\nYou can undo straight afterwards; after that only a backup brings it back.')) return;
        undoable((a.ex? a.ex.name : a.p.name)+' deleted',()=>{
          keepPrev();
          if(a.ex){ a.p.exercises=a.p.exercises.filter(e=>e!==a.ex); Object.keys(db.log).forEach(d=>{ const e=db.log[d][a.p.id]; if(e){ delete e.ex[a.ex.id]; if(e.order) e.order=e.order.filter(id=>id!==a.ex.id); } }); }
          else { db.plans=db.plans.filter(p=>p!==a.p); Object.keys(db.log).forEach(d=>{ delete db.log[d][a.p.id]; if(!Object.keys(db.log[d]).length) delete db.log[d]; }); }
          fixCurPlan(); commit(); renderSettings();
        });
      }));
      ag.appendChild(r);
    });
  }
  const dz=sec('','Downloads a backup first, then removes all plans and history from this phone.');
  dz.style.marginTop='32px';
  dz.appendChild(btn('row btn destructive center','<span class="lbl">Reset All Data…</span>',resetDefault));
  c.insertAdjacentHTML('beforeend','<div class="footnote ver">Gym Tracker '+APP_VERSION+'</div>');
}
$('saveErrExport').onclick=exportBackup;

/* ---------- calendar ---------- */
function openCal(){
  calCursor=firstOfMonth(curDate);
  formSheet({title:'Choose Date', ok:'Done', cancel:'Today', onCancel:()=>{ haptic(); goDate(todayStr()); },
    body:'<div class="cal"><div class="cal-top"><button class="round" id="calPrev" aria-label="Previous month">'+I('chevL')+'</button><b id="calTitle"></b><button class="round" id="calNext" aria-label="Next month">'+I('chevR')+'</button></div><div class="cal-grid" id="calGrid"></div></div>'+
      '<div class="group-f">Dots show the plans you trained that day.</div>',
    onOpen:()=>{ $('calPrev').onclick=()=>shiftMonth(-1); $('calNext').onclick=()=>shiftMonth(1); renderCal(); }});
}
function shiftMonth(n){ const d=parseYmd(calCursor); d.setDate(1); d.setMonth(d.getMonth()+n); calCursor=ymd(d); haptic(); renderCal(); }
function renderCal(){
  const base=parseYmd(calCursor), year=base.getFullYear(), month=base.getMonth(), today=todayStr();
  $('calTitle').textContent=base.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const startDow=(new Date(year,month,1).getDay()+6)%7, daysIn=new Date(year,month+1,0).getDate();
  let html=['M','T','W','T','F','S','S'].map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  for(let i=0;i<startDow;i++) html+='<div></div>';
  for(let day=1;day<=daysIn;day++){
    const ds=year+'-'+pad(month+1)+'-'+pad(day), plans=dayPlans(ds).map(planById);
    const cls='cal-day'+(ds===today? ' today' : '')+(ds===curDate? ' sel' : '');
    const dots=plans.slice(0,4).map(p=>'<i style="background:'+p.color+'"></i>').join('');
    html+='<button class="'+cls+'" data-d="'+ds+'" aria-label="'+esc(fullDate(ds)+(plans.length? ': '+plans.map(p=>p.name).join(', ') : ''))+'">'+day+(dots? '<span class="dots">'+dots+'</span>' : '')+'</button>';
  }
  const grid=$('calGrid'); grid.innerHTML=html;
  grid.querySelectorAll('.cal-day').forEach(b=>b.onclick=()=>{ haptic(); closeSheet($('formSheet'),()=>goDate(b.dataset.d)); });
}

/* ---------- master render + events ---------- */
function render(){
  hideTip(); closeSwipes();
  document.querySelectorAll('#tabbar button').forEach(b=>{ const on=b.dataset.view===view; b.classList.toggle('on',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(view==='plans'){ const p=planById(curPlan); if(!p||p.archived){ const a=db.plans.find(q=>!q.archived); curPlan=a? a.id : null; } }
  else if(view==='log') fixCurPlan();
  ({log:renderLogView, plans:renderPlansView, progress:renderProgressView, settings:renderSettingsView})[view]();
  observeTitle();
}
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>{
  if(view===b.dataset.view){ scrollTo({top:0,behavior:'smooth'}); return; }
  view=b.dataset.view; haptic(); render(); scrollTo(0,0);
});
window.addEventListener('scroll',hideTip,{passive:true});
/* Hide the floating bars while the keyboard is up so they never cover the field being typed in. */
const isTyping=el=>!!el&&el.matches&&el.matches('input[type=text],textarea');
document.addEventListener('focusin',e=>{ if(isTyping(e.target)) document.body.classList.add('kb'); });
document.addEventListener('focusout',()=>setTimeout(()=>{ if(!isTyping(document.activeElement)) document.body.classList.remove('kb'); },60));

/* ---------- undo ---------- */
let snackT=null, snackFn=null;
function snack(msg,label,fn,ms){
  $('snackTxt').textContent=msg; $('snackBtn').textContent=label; snackFn=fn;
  $('snack').classList.add('show'); clearTimeout(snackT); if(ms) snackT=setTimeout(hideSnack,ms);
}
function hideSnack(){ clearTimeout(snackT); snackFn=null; $('snack').classList.remove('show'); }
$('snackBtn').onclick=()=>{ const f=snackFn; hideSnack(); haptic(); if(f) f(); };
/* Runs a destructive change, then offers Undo for a few seconds by restoring a snapshot taken just before it.
   Starting to type dismisses the offer, so an undo can never wipe out numbers entered afterwards. */
function undoable(msg,action){
  const snap=JSON.stringify(db), cp=curPlan;
  action();
  snack(msg,'Undo',()=>{ db=JSON.parse(snap); curPlan=cp; commit(); render(); toast('Undone'); },6000);
}
document.addEventListener('focusin',e=>{ if(isTyping(e.target)) hideSnack(); });
/* Flush pending saves when the app is hidden; if it was left open overnight on "today", move to the new today. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ if(saveT) save(); return; }
  const t=todayStr(); if(t!==lastToday){ if(curDate===lastToday){ curDate=t; fixCurPlan(); applyUpNext(); render(); } lastToday=t; }
  tickRest();
});
window.addEventListener('pagehide',()=>{ if(saveT) save(); });

/* ---------- util ---------- */
let toastT;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }

/* ---------- boot ---------- */
applyTheme(); applyUpNext(); render();
if(bootNote==='migrated'){ if(commit()) toast('Data upgraded · the old copy is kept too'); }
else if(bootNote==='unreadable'){ alert('Your saved data could not be read, so the app started empty. A copy of the unreadable data was kept on this device. Import a backup from Settings to restore it.'); }
else if(bootNote==='blocked'){ $('saveErrTxt').textContent='This browser is blocking storage (private mode?), so nothing you log will be kept.'; $('saveErr').hidden=false; }
askPersist().then(()=>{ if(view==='settings') renderSettings(); });

/* ---------- update available ----------
   sw.js reports its VERSION; if it's newer than this page, a banner offers a reload.
   iOS keeps home-screen apps in memory for days, so check whenever the app comes back to the front. */
const verParts=v=>String(v).replace(/^\D+/,'').split('.').map(n=>parseInt(n,10)||0);
const newerThanApp=v=>{ const a=verParts(v), b=verParts(APP_VERSION); for(let i=0;i<3;i++){ if((a[i]||0)!==(b[i]||0)) return (a[i]||0)>(b[i]||0); } return false; };
$('updateBtn').onclick=()=>{ save(); location.reload(); };
$('updateLater').onclick=()=>{ $('update').classList.remove('show'); };
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const sw=navigator.serviceWorker, ask=()=>{ if(sw.controller) sw.controller.postMessage('version'); };
  sw.addEventListener('message',e=>{ if(e.data&&e.data.version&&newerThanApp(e.data.version)) $('update').classList.add('show'); });
  sw.addEventListener('controllerchange',ask);
  sw.register('sw.js').then(reg=>{
    ask();
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
  }).catch(()=>{});
}

</script>
